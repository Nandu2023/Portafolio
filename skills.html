<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis habilidades/cualidades</title>
    <link rel="stylesheet" href="./styles/styles_skills.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <strong>Hernando Ramirez P.</strong>
          <span id="id_profile_subtitle"></span>
        </div>
        <button
          id="id_goToHomePage"
          class="home-link"
          type="button"
          onclick="goToHomePage()"
        ></button>
      </header>

      <section class="hero" aria-labelledby="id_skills_h2">
        <p id="id_profile_label" class="eyebrow"></p>
        <h1 id="id_skills_h2"></h1>
      </section>

      <section aria-labelledby="id_featured_title">
        <div class="skills-header">
          <h2 id="id_featured_title"></h2>
          <a id="id_view_detail" href="#id_skill_detail"></a>
        </div>

        <div id="id_skills_grid" class="skills-grid"></div>
      </section>

      <section id="id_skill_detail" class="detail" aria-live="polite">
        <h2 id="id_detail_title"></h2>
        <div class="detail-panel">
          <h3 id="id_detail_subtitle"></h3>
          <p id="id_detail_text"></p>
          <div id="id_detail_tags" class="tags" aria-label="Areas clave"></div>
        </div>
      </section>
    </main>

    <script src="./script/script_skills.js"></script>
  </body>
</html>
