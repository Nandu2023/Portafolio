<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formacion y certificaciones</title>
    <link rel="stylesheet" href="./styles/styles_education.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <strong>Hernando Ramirez P.</strong>
          <span id="id_profile_subtitle"></span>
        </div>
        <button
          id="id_goToHomePage"
          class="home-link"
          type="button"
          onclick="goToHomePage()"
        ></button>
      </header>

      <section class="hero" aria-labelledby="id_education_h2">
        <p id="id_profile_label" class="eyebrow"></p>
        <h1 id="id_education_h2"></h1>
        <p id="id_education_intro" class="hero-copy"></p>
      </section>

      <section aria-labelledby="id_sections_title">
        <div class="education-header">
          <h2 id="id_sections_title"></h2>
          <a id="id_view_detail" href="#id_education_detail"></a>
        </div>

        <div id="id_section_grid" class="section-grid"></div>
      </section>

      <section id="id_education_detail" class="detail" aria-live="polite">
        <div class="detail-heading">
          <span id="id_detail_count" class="count-pill"></span>
          <h2 id="id_detail_title"></h2>
        </div>
        <div id="id_detail_items" class="detail-list"></div>
      </section>
    </main>

    <script src="./script/script_education.js"></script>
  </body>
</html>
