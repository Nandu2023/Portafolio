<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base de Conocimiento SAP HCM/HXM</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4f8;
      --panel: #ffffff;
      --panel-soft: #f7fafc;
      --text: #111827;
      --muted: #64748b;
      --line: #d9e2ea;
      --blue: #2563eb;
      --teal: #12a077;
      --violet: #6f55bd;
      --amber: #ef8f21;
      --slate: #475569;
      --shadow: 0 18px 40px rgba(15, 23, 42, .13);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(238, 244, 248, .94)), var(--bg);
      color: var(--text);
    }
    button, input { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .shell {
      width: min(1160px, calc(100% - 32px));
      margin: 36px auto;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, .35);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 76px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 230px; font-size: 13px; font-weight: 700; }
    .window-dots { display: flex; gap: 7px; flex: 0 0 auto; }
    .window-dots span { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .window-dots span:nth-child(1) { background: #ef4444; }
    .window-dots span:nth-child(2) { background: #f59e0b; }
    .window-dots span:nth-child(3) { background: #22c55e; }
    .profile { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 50%; background: #0f172a; color: #fff; }
    .profile svg { width: 16px; height: 16px; stroke-width: 2; }
    .hero {
      padding: 66px 28px 62px;
      border-bottom: 1px solid #e3edf5;
      background: linear-gradient(180deg, rgba(234, 245, 252, .92), rgba(244, 250, 253, .98)), #edf7fc;
      text-align: center;
    }
    .hero h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.08; letter-spacing: 0; }
    .content { padding: 28px 40px 56px; background: #fff; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .link-button { border: 0; background: transparent; color: var(--blue); cursor: pointer; font-size: 13px; font-weight: 700; }
    .category-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; margin-bottom: 32px; }
    .category-card {
      display: grid;
      min-height: 250px;
      padding: 24px 20px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 18px rgba(15, 23, 42, .035);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .category-card:hover, .category-card:focus-visible, .category-card.active {
      transform: translateY(-3px);
      border-color: #adc3dc;
      box-shadow: 0 16px 28px rgba(15, 23, 42, .09);
      outline: none;
    }
    .category-card.active { border-color: var(--blue); background: #e8f3ff; box-shadow: 0 16px 28px rgba(37, 99, 235, .13); }
    .icon-box { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 22px; border-radius: 14px; color: #fff; }
    .icon-box svg { width: 30px; height: 30px; stroke-width: 1.9; }
    .category-card h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: 0; }
    .category-card p { min-height: 76px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; color: #475569; font-size: 13px; font-weight: 700; }
    .arrow { display: grid; place-items: center; width: 28px; height: 28px; color: #334155; }
    .category-detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      margin: 0 0 36px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fbfe;
    }
    .detail-copy h2 { margin: 0 0 10px; font-size: 24px; letter-spacing: 0; }
    .detail-copy p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .quick-tags span { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border: 1px solid #cbd7e3; border-radius: 999px; background: #fff; color: #334155; font-size: 12px; font-weight: 700; }
    .record-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
    .article-card {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 24px;
      align-items: center;
      gap: 14px;
      min-height: 90px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: background .18s ease, border-color .18s ease;
    }
    .article-card:hover, .article-card:focus-visible { border-color: #b4c7dc; background: var(--panel-soft); outline: none; }
    .doc-icon { display: grid; place-items: center; width: 24px; height: 24px; color: var(--blue); }
    .article-title { display: block; overflow: hidden; color: #1f2937; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .article-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.45; }
    .record-viewer {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid #ccd9e6;
      border-radius: var(--radius);
      background: #fff;
    }
    .record-viewer h2 { margin: 0 0 16px; font-size: 24px; letter-spacing: 0; }
    .record-body {
      max-height: 760px;
      overflow: auto;
      padding: 20px;
      border-radius: var(--radius);
      background: #fbfdff;
      color: #1f2937;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .record-body strong { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; color: #111827; }
    .record-body a { color: var(--blue); text-decoration: underline; }
    .record-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 16px 0;
      border: 1px solid #d8e5f0;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(15, 23, 42, .08);
    }
    .empty-state { display: none; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
    .empty-state.visible { display: block; }
    @media (max-width: 1040px) {
      .category-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 920px) {
      .topbar { flex-wrap: wrap; min-height: auto; padding: 18px 22px 0; }
      .brand { flex: 1; }
      .hero { padding: 48px 22px; }
      .content { padding: 24px 24px 42px; }
      .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .record-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .shell { width: 100%; margin: 0; border-width: 0; border-radius: 0; }
      .hero h1 { font-size: 32px; }
      .category-grid { grid-template-columns: 1fr; }
      .category-card { min-height: 220px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .article-title { white-space: normal; }
    }
  </style>
</head>

resenta colisión. A continuación indico los pasos se que efectuaron para que el sistema en lugar de generar un mensaje de error de colisiones, coloque un warning (es una de varias opciones, todas están en la documentación adjunta): Se ingresa por SPRO -> IMG de Implementación -> Gestión de tiempos de personal -> Entrada y Gestión de datos de Tiempos -> Especificar reacciones en caso de superposición de infotipos tiempos Se entra por el infotipo 2002 y la clase de enlace temporal 03 (Que es la relevante para el subtipo 0450), y se selecciona la lupa. En este punto se elije el infotipo y la clase de enlace temporal con el que esta presentando colisión, para este caso it2002 clase 02. Se cambia el indicador de reacción del E (Error) al W (Warning), se graba y se transporta y al intentar grabar el registro, observamos que sale Warning, pero deja continuar para que se pueda grabar el registro normalmente. La solución es solo para este caso, ya que cada colisión depende del manejo de la misma.","html":"COLISIONES DE TIEMPOS O COLISIONES ENTRE INFOTIPOS\r\n\r\n        Para resolver el caso de este empleado:\r\n\r\n        Para este caso en el que se intenta grabar por el it2002 subtipo 0450, presenta colisión con el it2002 subtipo 0400.\r\n\r\n        En este caso se debe tener en cuenta la clase de enlace temporal que tiene el infotipo que se esta intentando grabar, como el infotipo que esta grabado y presenta colisión.\r\n\r\n        A continuación indico los pasos se que efectuaron para que el sistema en lugar de generar un mensaje de error de colisiones, coloque un warning (es una de varias opciones, todas están en la documentación adjunta):\r\n\r\n        Se ingresa por SPRO -> IMG de Implementación -> Gestión de tiempos de personal -> Entrada y Gestión de datos de Tiempos -> Especificar reacciones en caso de superposición de infotipos tiempos\r\n\r\n        Se entra por el infotipo 2002 y la clase de enlace temporal 03 (Que es la relevante para el subtipo 0450), y se selecciona la lupa.\r\n\r\n        En este punto se elije el infotipo y la clase de enlace temporal con el que esta presentando colisión, para este caso it2002 clase 02.\r\n\r\n        Se cambia el indicador de reacción del E (Error) al W (Warning), se graba y se transporta y al intentar grabar el registro, observamos que sale Warning, pero deja continuar para que se pueda grabar el registro normalmente.  La solución es solo para este caso, ya que cada colisión depende del manejo de la misma."},{"id":"rec-18","category":"nomina","title":"ERROR TABLA 510 CONVENIO","summary":"ERROR TABLA 510 CONVENIO: Error en valoración indirecta Ingrese al SPRO, IMG, a la ruta: Gestión de personal  Gestión de personal  Datos de nomina  Emol.basicos  Áreas personal para regl","search":"ERROR TABLA 510 CONVENIO: Error en valoración indirecta Ingrese al SPRO, IMG, a la ruta: Gestión de personal  Gestión de personal  Datos de nomina  Emol.basicos  Áreas personal para regla p.cálculo nómina y reg.convenio Al ingresar digite agrupación de países: 38. Cuando la persona se retira, observamos que el grupo de personal es ”I”, buscamos el área de personal en este caso “N5”, Y se debe definir la agrupación de áreas de personal para Regla de nomina y la agrupación de áreas para regulación por convenio. Que para este caso no esta llena, debe ser configurada y volver a liquidar.","html":"ERROR TABLA 510 CONVENIO: Error en valoración indirecta\r\n\r\n        Ingrese al SPRO, IMG, a la ruta:  Gestión de personal     Gestión de personal   Datos de nomina    Emol.basicos   Áreas personal para regla p.cálculo nómina y reg.convenio\r\n\r\n        Al ingresar digite agrupación de países: 38.\r\n\r\n        Cuando la persona se retira, observamos que el grupo de personal es ”I”, buscamos el área de personal en este caso “N5”,\r\n        Y se debe definir la agrupación de áreas de personal para Regla de nomina y la agrupación de áreas para regulación por convenio.\r\n\r\n        Que para este igito 01.01.2006, y ya dejo seguir. Ya que estaba haciendo proceso con el periodo 06 de 2006."},{"id":"rec-21","category":"nomina","title":"PARA CONOCER EL % PORCENTAJE UTILIZADO EN EL CALCULOS DE VALORACION DE LAS HORAS EXTRAS Se h","summary":"PARA CONOCER EL % PORCENTAJE UTILIZADO EN EL CALCULOS DE VALORACION DE LAS HORAS EXTRAS Se hace seguimiento al esquema para el calculo de la nomina, eso debe ser en alicuotacion y se mira la","search":"PARA CONOCER EL % PORCENTAJE UTILIZADO EN EL CALCULOS DE VALORACION DE LAS HORAS EXTRAS Se hace seguimiento al esquema para el calculo de la nomina, eso debe ser en alicuotacion y se mira la tabla V_512W_B.","html":"PARA CONOCER EL % PORCENTAJE UTILIZADO EN EL CALCULOS DE VALORACION DE LAS HORAS EXTRAS\r\n\r\n        Se hace seguimiento al esquema para el calculo de la nomina, eso debe ser en alicuotacion y se mira la tabla V_512W_B."},{"id":"rec-22","category":"abap","title":"PN-PABRP nro periodo PN-PABRJ ano periodo","summary":"PN-PABRP nro periodo PN-PABRJ ano periodo","search":"PN-PABRP nro periodo PN-PABRJ ano periodo","html":"PN-PABRP nro periodo\r\n        PN-PABRJ ano periodo"},{"id":"rec-23","category":"autorizaciones","title":"PARA VERIFICAR AUTORIZACIONES A LAS TRANSACCIONES Por la SU24 se digita el código de la tran","summary":"PARA VERIFICAR AUTORIZACIONES A LAS TRANSACCIONES Por la SU24 se digita el código de la transacción para ver los permisos: Por ejemplo para la PPOME Se revisan los nombres de los objetos en ","search":"PARA VERIFICAR AUTORIZACIONES A LAS TRANSACCIONES Por la SU24 se digita el código de la transacción para ver los permisos: Por ejemplo para la PPOME Se revisan los nombres de los objetos en este caso la P_ORGIN muestra los accesos a cambios de datos maestros, si le damos doble click y modificar, vemos una pantalla similar a la siguiente, indicando cuales campos podemos configurar: Lo importante es saber que por esta pantalla no se modifica NADA, son los valores que va a proponer el sistema cuando ejecutemos la transacción SU01. También tener en cuenta el objeto P_TCODE y PLOG que el la autorización para modificar OM. Otra vista de los campos que contiene es SU24 se elige HR y se da doble click sobre el objeto a mirar Bien, una vez revisados estos parámetros, debemos ingresar a la transacción PFCG, se crea el rol necesario y en la pestaña Menú, se agregan las transacciones a manejar. Luego en la pestaña autorizaciones se configura el perfil, de acuerdo a las autorizaciones que se le dan al perfil. (El perfil es único por rol, el rol si se puede compartir). Luego en la pestaña Usuario se indica que usuarios van a utilizar este rol. Importantísimo Activar los menús, Autorizaciones y usuario (Click en botón Comparar usuario). Para que genere un perfil básico por la PA30 debe tener las autorizaciones basicas así: La siguiente vista no permite modificar el infotipo 8 por la PA30 solo lo ve, pero los otros infotipos si los deja modificar Para modificar ciertos infotipos o por ciertas transacciones como la PA40 se requiere autorizacion de objeto PLOG así: Con estas opciones tiene acceso a todo, de ahí para adelante se configura cada acceso. Para que de solo acceso al infotipo que uno necesite elija el objetos de autorización haga filtro por uno de esos objetos y pruebe. Si se crean dos roles uno para transacción PA30 y que no toque el infotipo 8, y se crea otro rol con la PA40 y que toque el infotipo 8, la autorizacion no funciona, es decir, al tocar los datos maestros, afectan directamente a ambos roles, así no sea la misma transacción. R: lectura de los datos. Siempre debemos colocarla en todos los niveles para que al menos lea la informacion. W: permite insertar, modificar, borrar y desbloquear registros bloqueados. M: Permite al usuario mostrar informacion de consultas, cuando invoca el matchcode de empleados. S: Permite que un usuario ingrese un registro bloqueado y que el mismo usuario no lo pueda desbloquear. E: Permite que un usuario ingrese un registro bloqueado. (Es muy parecido a la S). D: Cuando existe un registro bloqueado, el este usuario lo puede desbloquear. *: Permite todas las autorizaciones. Mas documentación en: http://help.sap.com/saphelp_470/helpdata/es/ef/4aba3b3bf00152e10000000a114084/content.htm Esta es la instrucción clave para dar acceso a los infotipos con autorización P_ORGIN Para los objetos de planificación de personal: OM, PD, CM, etc, se valida la tabla T77FC Códigos de función HR-PD Aparecen los usuarios, es IMPORTANTE DESPUES DE CUALQUIER CAMBIO EJECUTAR el icono Comparar usuario Existen varias configuraciones que podrían ejecutarse, pero esta es la básica. Ahora bien, si deseamos conocer a que no tuvo acceso, ejecutamos la transacción por ejemplo la PA30, cuando salga un mensaje de error o no genere información, estando en esa pantalla se le da /Nsu53, y ahí se muestra en rojo a lo que no tuvo autorización. No es aconsejable colocar el objeto de autorización P_ABAP, ya que tumba la autorización del get pernr. SU56: verifica el estado de los objetos de autorizacion, si SAPALL esta incluido o no.","html":"PARA VERIFICAR AUTORIZACIONES A LAS TRANSACCIONES\r\n\r\n        Por la SU24 se digita el código de la transacción para ver los permisos:\r\n        Por ejemplo para la PPOME\r\n\r\n        Se revisan los nombres de los objetos en este caso la P_ORGIN muestra los accesos a cambios de datos maestros, si le damos doble click y modificar, vemos una pantalla similar a la siguiente, indicando cuales campos podemos configurar:\r\n        <img src=\"img/p_orgin1.jpg\"  loading=\"lazy\" alt=\"p_orgin1\">\r\n\r\n        Lo importante es saber que por esta pantalla no se modifica NADA, son los valores que va a proponer el sistema cuando ejecutemos la transacción SU01.\r\n\r\n        También tener en cuenta el objeto P_TCODE y PLOG que el la autorización para modificar OM.\r\n\r\n        Otra vista de los campos que contiene es SU24 se elige HR y se da doble click sobre el objeto a mirar\r\n\r\n        Bien, una vez revisados estos parámetros, debemos ingresar a la transacción PFCG, se crea el rol necesario y en la pestaña Menú, se agregan las transacciones a manejar.\r\n\r\n        Luego en la pestaña autorizaciones se configura el perfil, de acuerdo a las autorizaciones que se le dan al perfil. (El perfil es único por rol, el rol si se puede compartir).\r\n\r\n        Luego en la pestaña Usuario se indica que usuarios van a utilizar este rol.\r\n\r\n        Importantísimo Activar los menús, Autorizaciones y usuario (Click en botón Comparar usuario).\r\n\r\n        Para que genere un perfil básico por la PA30 debe tener las autorizaciones basicas así:\r\n\r\n        La siguiente vista no permite modificar el infotipo 8 por la PA30 solo lo ve, pero los otros infotipos si los deja modificar\r\n        <img src=\"img/p_orgin2.jpg\"  loading=\"lazy\" alt=\"p_orgin2\">\r\n        <img src=\"img/p_orgin3.jpg\"  loading=\"lazy\" alt=\"p_orgin3\">\r\n        Para modificar ciertos infotipos o por ciertas transacciones como la PA40 se requiere autorizacion de objeto PLOG así:\r\n        <img src=\"img/p_orgin4.jpg\"  loading=\"lazy\" alt=\"p_orgin4\">\r\n\r\n        Con estas opciones tiene acceso a todo, de ahí para adelante se configura cada acceso.\r\n\r\n        Para que de solo acceso al infotipo que uno necesite elija el objetos de autorización haga filtro por uno de esos objetos y pruebe.\r\n\r\n        Si se crean dos roles uno para transacción PA30 y que no toque el infotipo 8, y se crea otro rol con la PA40 y que toque el infotipo 8, la autorizacion no funciona, es decir, al tocar los datos maestros, afectan directamente a ambos roles, así no sea la misma transacción.\r\n\r\n        R: lectura de los datos. Siempre debemos colocarla en todos los niveles para que al menos lea la informacion.\r\n        W: permite insertar, modificar, borrar y desbloquear registros bloqueados.\r\n        M: Permite al usuario mostrar informacion de consultas, cuando invoca el matchcode de empleados.\r\n        S: Permite que un usuario ingrese un registro bloqueado y que el mismo usuario no lo pueda desbloquear.\r\n        E: Permite que un usuario ingrese un registro bloqueado. (Es muy parecido a la S).\r\n        D: Cuando existe un registro bloqueado, el este usuario lo puede desbloquear.\r\n        *: Permite todas las autorizaciones.\r\n\r\n        Mas documentación en:\r\n        http://help.sap.com/saphelp_470/helpdata/es/ef/4aba3b3bf00152e10000000a114084/content.htm\r\n\r\n        Esta es la instrucción clave para dar acceso a los infotipos con autorización P_ORGIN\r\n        <img src=\"img/DYNAMIC_MENUE1.png\"  loading=\"lazy\" alt=\"DYNAMIC_MENUE1\">\r\n\r\n        Para los objetos de planificación de personal: OM, PD, CM, etc, se valida la tabla T77FC Códigos de función HR-PD\r\n\r\n        Aparecen los usuarios, es IMPORTANTE DESPUES DE CUALQUIER CAMBIO EJECUTAR el icono   Comparar usuario\r\n\r\n        Existen varias configuraciones que podrían ejecutarse, pero esta es la básica.\r\n\r\n        Ahora bien, si deseamos conocer a que no tuvo acceso, ejecutamos la transacción por ejemplo la PA30, cuando salga un mensaje de error o no genere información, estando en esa pantalla se le da /Nsu53, y ahí se muestra en rojo a lo que no tuvo autorización.\r\n        No es aconsejable colocar el objeto de autorización P_ABAP, ya que tumba la autorización del get pernr.\r\n\r\n        SU56: verifica el estado de los objetos de autorizacion, si SAPALL esta incluido o no."},{"id":"rec-24","category":"transacciones","title":"PARA PEDIR CAMPOS DEL DYNPRO, OPCIONALES U OBLIGATORIOS EN HCM Ingrese por el SPRO -> Gestió","summary":"PARA PEDIR CAMPOS DEL DYNPRO, OPCIONALES U OBLIGATORIOS EN HCM Ingrese por el SPRO -> Gestión de personal -> Gestión de personal -> Adaptación de las superficies -> Modificar modific.imagen.","search":"PARA PEDIR CAMPOS DEL DYNPRO, OPCIONALES U OBLIGATORIOS EN HCM Ingrese por el SPRO -> Gestión de personal -> Gestión de personal -> Adaptación de las superficies -> Modificar modific.imagen. Se elige el DYNPRO y en la columna Clave variable va el código del país 38 (si la tiene) y doble click y se modifica el campo necesario.","html":"PARA PEDIR CAMPOS DEL DYNPRO, OPCIONALES U OBLIGATORIOS EN HCM\r\n\r\n        Ingrese por el SPRO -> Gestión de personal -> Gestión de personal -> Adaptación de las superficies -> Modificar modific.imagen.\r\n        Se elige el DYNPRO y en la columna Clave variable va el código del país 38 (si la tiene) y doble click y se modifica el campo necesario."},{"id":"rec-25","category":"abap","title":"PERFORM QUE LEE LAS CARACTERÍSTICAS PROPUESTA A CADA INFOTIPO PERFORM re549d USING 'ABKRS' '","summary":"PERFORM QUE LEE LAS CARACTERÍSTICAS PROPUESTA A CADA INFOTIPO PERFORM re549d USING 'ABKRS' '3' t549b_abkrs t549brc. O la FUNCIÓN HR_FEATURE_BACKFIELD","search":"PERFORM QUE LEE LAS CARACTERÍSTICAS PROPUESTA A CADA INFOTIPO PERFORM re549d USING 'ABKRS' '3' t549b_abkrs t549brc. O la FUNCIÓN HR_FEATURE_BACKFIELD","html":"PERFORM QUE LEE LAS CARACTERÍSTICAS\r\n        PROPUESTA A CADA INFOTIPO\r\n\r\n        PERFORM re549d USING 'ABKRS' '3' t549b_abkrs t549brc.\r\n        O la FUNCIÓN HR_FEATURE_BACKFIELD"},{"id":"rec-26","category":"tiempos","title":"USER EXIT DE TIEMPOS","summary":"USER EXIT DE TIEMPOS: HRPTIM0*","search":"USER EXIT DE TIEMPOS: HRPTIM0*","html":"USER EXIT DE TIEMPOS: HRPTIM0*"},{"id":"rec-27","category":"abap","title":"CAPTURA DE ÁREA Y PERIODO DE NOMINA EN LA SELECTION-SCREEN PARA QUE LA PRIMERA PANTALLA SEA ","summary":"CAPTURA DE ÁREA Y PERIODO DE NOMINA EN LA SELECTION-SCREEN PARA QUE LA PRIMERA PANTALLA SEA ÁREA Y PERIODO, Y NO FECHA INICIAL Y FINAL La primera opcion siempre debe ser generar una clase de","search":"CAPTURA DE ÁREA Y PERIODO DE NOMINA EN LA SELECTION-SCREEN PARA QUE LA PRIMERA PANTALLA SEA ÁREA Y PERIODO, Y NO FECHA INICIAL Y FINAL La primera opcion siempre debe ser generar una clase de report (la menciono en algun momento). Ahora bien si se quiere por ABAP, se le tiene: IF p_first_screen = 'X' AND pnpbegda IS INITIAL AND pnppernr IS INITIAL AND pnpbukrs IS INITIAL. p_first_screen = ' '. PERFORM first_screen. ENDIF. *&---------------------------------------------------------------------* *& Form FIRST_SCREEN *&---------------------------------------------------------------------* * text *----------------------------------------------------------------------* * --> p1 text * <-- p2 text *----------------------------------------------------------------------* FORM first_screen . LOOP AT SCREEN. IF ( screen-group1 = 'ZB2' OR screen-group1 = 'ZBK' ) AND screen-group2 = 'DBS' AND ( screen-group4 = '091' OR screen-group4 = '093' OR screen-group4 = '095' OR screen-group4 = '099' OR screen-group4 = '101' OR screen-group4 = '105' ). screen-invisible = 1. screen-input = 0. screen-output = 0. screen-active = 0. ENDIF. MODIFY SCREEN. ENDLOOP. LOOP AT SCREEN. IF screen-name = 'PNPXABKR' OR screen-name = 'PNPTIMR9' OR screen-name = 'PNPTIMRA' OR screen-name = 'PNPPABRP' OR screen-name = 'PNPPABRJ' OR screen-name = '%PBLT161_1000'. screen-invisible = 0. screen-input = 1. screen-output = 1. screen-active = 1. ENDIF. IF screen-name = '%FDPE130_1000' OR screen-name = '%FZP1142_1000' OR screen-name = '%FZP2152_1000'. screen-invisible = 0. screen-input = 0. screen-output = 1. screen-active = 1. ENDIF. MODIFY SCREEN. ENDLOOP. Esta es la mejor opcion para ocultar los campos iniciales de la pantalla, de rangos de fechas AT SELECTION-SCREEN OUTPUT. oculta solo rangos pnptbeg = 'Fecha de entrega'. LOOP AT SCREEN. IF screen-group1 = 'ZBK' OR screen-group1 = 'ZB2'. screen-invisible = 1. screen-input = 0. screen-output = 0. screen-active = 0. ENDIF. MODIFY SCREEN. ENDLOOP. LOOP AT SCREEN. IF screen-group1 = 'ZBK' OR screen-group1 = 'ZB2' OR screen-group1 = 'XDA' OR screen-group1 = 'PER' OR screen-group1 = 'XPS'. screen-invisible = 1. screen-input = 0. screen-output = 0. screen-active = 0. ENDIF. MODIFY SCREEN. ENDLOOP. ENDFORM. \" FIRST_SCREEN","html":"CAPTURA DE ÁREA Y PERIODO DE NOMINA EN LA SELECTION-SCREEN PARA QUE LA PRIMERA PANTALLA SEA ÁREA Y PERIODO, Y NO FECHA INICIAL Y FINAL\r\n\r\n        La primera opcion siempre debe ser generar una clase de report (la menciono en algun momento).\r\n        Ahora bien si se quiere por ABAP, se le tiene:\r\n\r\n        IF   p_first_screen     = 'X' AND\r\n             pnpbegda           IS INITIAL AND\r\n             pnppernr           IS INITIAL AND\r\n             pnpbukrs           IS INITIAL.\r\n          p_first_screen     = ' '.\r\n          PERFORM first_screen.\r\n        ENDIF.\r\n\r\n      *&---------------------------------------------------------------------*\r\n      *&      Form  FIRST_SCREEN\r\n      *&---------------------------------------------------------------------*\r\n      *       text\r\n      *----------------------------------------------------------------------*\r\n      *  -->  p1        text\r\n      *  <--  p2        text\r\n      *----------------------------------------------------------------------*\r\n      FORM first_screen .\r\n\r\n        LOOP AT SCREEN.\r\n          IF ( screen-group1 = 'ZB2' OR\r\n               screen-group1 = 'ZBK' ) AND\r\n               screen-group2 = 'DBS'  AND\r\n             ( screen-group4 = '091' OR\r\n               screen-group4 = '093' OR\r\n               screen-group4 = '095' OR\r\n               screen-group4 = '099' OR\r\n               screen-group4 = '101' OR\r\n               screen-group4 = '105' ).\r\n            screen-invisible = 1.\r\n            screen-input     = 0.\r\n            screen-output    = 0.\r\n            screen-active    = 0.\r\n          ENDIF.\r\n          MODIFY SCREEN.\r\n        ENDLOOP.\r\n\r\n        LOOP AT SCREEN.\r\n          IF screen-name = 'PNPXABKR' OR\r\n             screen-name = 'PNPTIMR9' OR\r\n            screen-name = 'PNPTIMRA' OR\r\n            screen-name = 'PNPPABRP' OR\r\n            screen-name = 'PNPPABRJ' OR\r\n            screen-name = '%PBLT161_1000'.\r\n            screen-invisible = 0.\r\n            screen-input = 1.\r\n            screen-output = 1.\r\n            screen-active = 1.\r\n          ENDIF.\r\n\r\n          IF screen-name = '%FDPE130_1000' OR\r\n            screen-name = '%FZP1142_1000' OR\r\n            screen-name = '%FZP2152_1000'.\r\n            screen-invisible = 0.\r\n            screen-input = 0.\r\n            screen-output = 1.\r\n            screen-active = 1.\r\n          ENDIF.\r\n          MODIFY SCREEN.\r\n        ENDLOOP.\r\n\r\n      Esta es la mejor opcion para ocultar los campos iniciales de la pantalla, de rangos de fechas\r\n\r\n      AT SELECTION-SCREEN OUTPUT.\r\n      oculta solo rangos\r\n      pnptbeg = 'Fecha de entrega'.\r\n        LOOP AT SCREEN.\r\n          IF screen-group1   = 'ZBK' OR\r\n            screen-group1    = 'ZB2'.\r\n            screen-invisible = 1.\r\n            screen-input     = 0.\r\n            screen-output    = 0.\r\n            screen-active    = 0.\r\n          ENDIF.\r\n          MODIFY SCREEN.\r\n        ENDLOOP.\r\n\r\n        LOOP AT SCREEN.\r\n          IF screen-group1 = 'ZBK' OR\r\n            screen-group1 = 'ZB2' OR\r\n            screen-group1 = 'XDA' OR\r\n            screen-group1 = 'PER' OR\r\n            screen-group1 = 'XPS'.\r\n            screen-invisible = 1.\r\n            screen-input = 0.\r\n            screen-output = 0.\r\n            screen-active = 0.\r\n          ENDIF.\r\n          MODIFY SCREEN.\r\n        ENDLOOP.\r\n      ENDFORM.                    \" FIRST_SCREEN"},{"id":"rec-28","category":"abap","title":"PARA QUE EN LA SELECTION-SCREEN SOLO PREGUNTE LA FECHA DE INICIO Y FIN DEL PN-BEGDA Y PN-END","summary":"PARA QUE EN LA SELECTION-SCREEN SOLO PREGUNTE LA FECHA DE INICIO Y FIN DEL PN-BEGDA Y PN-ENDDA Se puede definir una clase de report, o se puede dejar en blanco. LOOP AT SCREEN. IF screen-gro","search":"PARA QUE EN LA SELECTION-SCREEN SOLO PREGUNTE LA FECHA PT_11 y a partir de eso se crea el nuevo query con su respectivo nombre que se quiera y ya aparece en la S_PH0_48000510 - Ad-hoc-Query"},{"id":"rec-36","category":"abap","title":"INFOSETS, AGREGAR UN INFOTIPO A UN ADHOC QUERY POR INFOSET SQ02","summary":"INFOSETS, AGREGAR UN INFOTIPO A UN ADHOC QUERY POR INFOSET SQ02: transportar cuando ya no pide orden: Break en SE38 RSAQDEVC linea 490 call method iref->corr_insert_infoset Ahi se encuentra ","search":"INFOSETS, AGREGAR UN INFOTIPO A UN ADHOC QUERY POR INFOSET SQ02: transportar cuando ya no pide orden: Break en SE38 RSAQDEVC linea 490 call method iref->corr_insert_infoset Ahi se encuentra la OT con el nro liberar. Ingresa por la opción Recursos Humanos  Sistema de información  Opciones  Parametrizaciones actuales  S_AHR_61010454 - Query SAP: Actualizar InfoSet, O SQ02 Se llama el Z* Definido… para agregar una tabla 9*, por el Menú Tratar  Modificar selección de Infotipos, luego se pasa para el lado derecho de la pantalla, creando un grupo de campos.","html":"INFOSETS, AGREGAR UN INFOTIPO A UN ADHOC QUERY POR INFOSET\r\n\r\n        SQ02: transportar cuando ya no pide orden:\r\n\r\n        Break en SE38 RSAQDEVC  linea 490\r\n          call method iref->corr_insert_infoset\r\n\r\n        Ahi se encuentra la OT con el nro liberar.\r\n\r\n        Ingresa por la opción Recursos Humanos  Sistema de información  Opciones  Parametrizaciones actuales  S_AHR_61010454 - Query SAP: Actualizar InfoSet,  O SQ02\r\n\r\n        Se llama el Z* Definido… para agregar una tabla 9*, por el Menú Tratar  Modificar selección de Infotipos, luego se pasa para el lado derecho de la pantalla, creando un grupo de campos."},{"id":"rec-37","category":"abap","title":"TRATAMIENTO DE INFOSETS Los infosets deben ser modificados en el mandante de configuración K","summary":"TRATAMIENTO DE INFOSETS Los infosets deben ser modificados en el mandante de configuración K o Workbech, ya que si se necesitan crear campos debe permitir hacerlo, los c l código del grupo de usuarios, la G final indica que es de ámbito global. Ejemplo: /SAPQUERY/HTG D_SREPOVARI-EXTDREPORT: nombre del query. Ejemplo ZQCO_PT_012 Luego se pega en el menú SAP por la se43. Para corregir inconsistencias por nombres de campos de selección o hacerle mejoras de algun tipo se ingresa a la transacción SQ01, alli se trata el adhoc. En cierta ocacion molesto por que al ejecutar la transacción tenia error al buscar la variante STÁNDAR, si es necesario se puede borrar, el problema es k al compilar el adhoc query vuelve y lo genera.","html":"TRATAMIENTO DE ADHOC QUERYS\r\n\r\n        Se crea el adhoc query en el mandante deseado, si se necesita transportar eso es un camello pero se puede hace, buscar en este documento el titulo  TRANSPORTE DE ADHOC QUERYS  … entonces para crear el adhoc se ingresa a la transacción S_PH0_48000513 - Ad-hoc-Query, por ahí se crea el adhoc común y corriente tanto de los campos de selección como de salida, inclusive en los campos de selección se pueden grabar valores predeterminados.\r\n\r\n        Para mejorar la utilidad del adhoc es mejor ligarle una transacción, para ello se ingresa a la transacción se93 y se graba con parámetros, para ello es mejor mirar una ya echa por SAP, por ejemplo la S_PH0_48000450 - Resumen fechas\r\n\r\n        <img src=\"img/sq013.jpg\"  loading=\"lazy\" alt=\"sq013\">\r\n\r\n        D_SREPOVARI-REPORT: es el código del grupo de usuarios, la G final indica que es de ámbito global. Ejemplo: /SAPQUERY/HTG\r\n\r\n        D_SREPOVARI-EXTDREPORT: nombre del query. Ejemplo ZQCO_PT_012\r\n\r\n        Luego se pega en el menú SAP por la se43.\r\n\r\n        Para corregir inconsistencias por nombres de campos de selección o hacerle mejoras de algun tipo  se ingresa a la transacción SQ01, alli se trata el adhoc.\r\n\r\n        En cierta ocacion molesto por que al ejecutar la transacción tenia error al buscar la variante STÁNDAR, si es necesario se puede borrar, el problema es k al compilar el adhoc query vuelve y lo genera."},{"id":"rec-39","category":"tiempos","title":"CREAR TRANSPORTE DE ADHOC QUERYS Se crean los querys en el mandante Workbench, el sistema pr","summary":"CREAR TRANSPORTE DE ADHOC QUERYS Se crean los querys en el mandante Workbench, el sistema pregunta la orden de transporte. Siempre crearlo como de ámbito global. Transacción SQ01 Se elige el","search":"CREAR TRANSPORTE DE ADHOC QUERYS Se crean los querys en el mandante Workbench, el sistema pregunta la orden de transporte. Siempre crearlo como de ámbito global. Transacción SQ01 Se elige el grupo de usuarios (Para tiempos /SAPQUERY/HT) Se seleccionan los campos de selección y lista Se graba el query. El paquete se llama /SAPQUERY/HR buscarlo a ver si existe. Se devuelve a la transacción SQ01, se ejecuta y mejora los necesario a través de la opción modificar. Lo que es complicado es crear el query en mandate DEV de pruebas y transportarlo, eso si es como se indica a continuación, pero toca con truco y SAP ALL.","html":"CREAR TRANSPORTE DE ADHOC QUERYS\r\n        Se crean los querys en el mandante Workbench, el sistema pregunta la orden de transporte. Siempre crearlo como de ámbito global.\r\n        Transacción SQ01\r\n        Se elige el grupo de usuarios (Para tiempos /SAPQUERY/HT)\r\n        Se seleccionan los campos de selección y lista\r\n        Se graba el query. El paquete se llama /SAPQUERY/HR buscarlo a ver si existe.\r\n        Se devuelve a la transacción SQ01, se ejecuta y mejora los necesario a través de la opción modificar.\r\n\r\n        Lo que es complicado es crear el query en mandate DEV de pruebas y transportarlo, eso si es como se indica a continuación, pero toca con truco y SAP ALL."},{"id":"rec-40","category":"tiempos","title":"ERROR DE TIEMPOS POR FALTA DE HORAS EN EL INFOTIPO 0008 EMOLUMENTOS BÁSICOS División por cer","summary":"ERROR DE TIEMPOS POR FALTA DE HORAS EN EL INFOTIPO 0008 EMOLUMENTOS BÁSICOS División por cero no se ha realizado","search":"ERROR DE TIEMPOS 0 Include: PCPROCO0 CALL FUNCTION it_t7co22-mfunc Aqui hace el llamado a todas las funciones de las provisones","html":"PARA DEBUG DE LAS PROVISIONES DE LA NOMINA COLOMBIA\r\n\r\n        Programa: HCOCALC0\r\n        Include: PCPROCO0\r\n\r\n          CALL FUNCTION it_t7co22-mfunc\r\n        Aqui hace el llamado a todas las funciones de las provisones"},{"id":"rec-49","category":"transacciones","title":"ESTADOS REGISTRO DE GESTION EN EL AREA DE NOMINA - PA03 Tabla T569V tiene los estados que ma","summary":"ESTADOS REGISTRO DE GESTION EN EL AREA DE NOMINA - PA03 Tabla T569V tiene los estados que maneja el registro de gestión por area de nomina","search":"ESTADOS REGISTRO DE GESTION EN EL AREA DE NOMINA - PA03 Tabla T569V tiene los estados que maneja el registro de gestión por area de nomina","html":"ESTADOS REGISTRO DE GESTION EN EL AREA DE NOMINA - PA03\r\n\r\n        Tabla T569V tiene los estados que maneja el registro de gestión por area de nomina"},{"id":"rec-50","category":"abap","title":"CORRESPONDENCIA – MAILMERGE SAP Y WORD Pasos","summary":"CORRESPONDENCIA – MAILMERGE SAP Y WORD Pasos: 1. Tener el documento Word final con la carreta que se va a crear e identificar los campos variables. Recordar que la fecha del dia puede ser in","search":"CORRESPONDENCIA – MAILMERGE SAP Y WORD Pasos: 1. Tener el documento Word final con la carreta que se va a crear e identificar los campos variables. Recordar que la fecha del dia puede ser insertada, y la fecha de SAP dd.mm.aaaa a través de formato se puede adaptar para que se ejemplo: 25 de marzo de 2010 por una de la opciones de salida de Word. 2. Crear Query en SAP Ejecutar Query la primera vez, e indicar “Tratamiento de textos” usualmente este icono “Tratamiento de textos”  Tratamiento de cartas tipo con MS Word Indicamos Luego Doc. Wor nuevo  Sin clave acceso 3. Nos sale undocumento Word nuevo con el mensaje “Insertar los campos de carta tipo” 4. Se inserta la carreta que va en el documento por la opción “Insertar campo combinado” así: 5. Para verificar como va quedando el documento se da la opción vista previa de resultados así: y con el siguiente icono se va revisando como va quedando 6. Cuando estamos seguros que quedo bien, grabamos la plantilla y salimos del documento. 7. Ahora, para volver a probar, ejecutamos nuevamente el Query, pero esta vez indicamos el nombre del archivo en Word así: “Tratamiento de textos”  Tratamiento de cartas tipo con MS Word Luego Doc. Wor existente  Sin clave acceso 8. Nos pide el nombre de la plantilla guardada, y se puede iniciar la correspondencia respectiva. Para acceder a cambiar el formato fecha se puede de 2 formas: • De da editar sobre el campo, se elije la categoría date con el formato a imprimir, luego se da click sobre el botón Codigos de campo y se agrega la palabra MERGEFIELD “Nombre del campo” luego grabar y se prueba nuevamente, queda similar a MERGEFIELD “ffinal” \\@ \"dddd, dd' de 'MMMM' de 'yyyy\". El problema es k si se vuelve a consultar se pierde el formato y toca volver a hacerlo, por eso es mejor darle Alt+F9. • Para editar la fecha en la carta Word, nos unicamos en el campo: ejemplo {pn-begda}, en el Word se digita Alt+F9 aparece por ejemplo {MERGEFIELD pn-begda} lo que se hace es modificar el formato de salida así: {MERGEFIELD “pn-begda” \\@ “dd MMMM yyyy”} se vuelve y se digita Alt+F9, se graba la plantilla y se prueba nuevamente.","html":"CORRESPONDENCIA – MAILMERGE SAP Y WORD\r\n\r\n        Pasos:\r\n\r\n        1.\tTener el documento Word final con la carreta que se va a crear e identificar los campos variables. Recordar que la fecha del dia puede ser insertada, y la fecha de SAP dd.mm.aaaa a través de formato se puede adaptar para que se ejemplo: 25 de marzo de 2010 por una de la opciones de salida de Word.\r\n        2.\tCrear Query en SAP\r\n        Ejecutar Query la primera vez, e indicar “Tratamiento de textos” usualmente este icono    “Tratamiento de textos”  Tratamiento de cartas tipo con MS Word\r\n\r\n        Indicamos <img src=\"img/MAILMERGE1.jpg\"  loading=\"lazy\" alt=\"MAILMERGE1\">\r\n\r\n        Luego Doc. Wor nuevo  Sin clave acceso <img src=\"img/MAILMERGE2.jpg\"  loading=\"lazy\" alt=\"MAILMERGE2\">\r\n\r\n        3.\tNos sale undocumento Word nuevo con el mensaje “Insertar los campos de carta tipo”\r\n        <img src=\"img/MAILMERGE3.jpg\"  loading=\"lazy\" alt=\"MAILMERGE3\">\r\n        4.\tSe inserta la carreta que va en el documento por la opción “Insertar campo combinado” así:\r\n        <img src=\"img/MAILMERGE4.jpg\"  loading=\"lazy\" alt=\"MAILMERGE4\">\r\n        5.\tPara verificar como va quedando el documento se da la opción vista previa de resultados así:\r\n        <img src=\"img/MAILMERGE5.jpg\"  loading=\"lazy\" alt=\"MAILMERGE5\">\r\n        y con el siguiente icono se va revisando como va quedando\r\n        <img src=\"img/MAILMERGE6.jpg\"  loading=\"lazy\" alt=\"MAILMERGE6\">\r\n        6.\tCuando estamos seguros que quedo bien, grabamos la plantilla y salimos del documento.\r\n\r\n        7.\tAhora, para volver a probar, ejecutamos nuevamente el Query, pero esta vez indicamos el nombre del archivo en Word así:\r\n        “Tratamiento de textos”  Tratamiento de cartas tipo con MS Word\r\n        <img src=\"img/MAILMERGE7.jpg\"  loading=\"lazy\" alt=\"MAILMERGE7\">\r\n        Luego Doc. Wor existente  Sin clave acceso\r\n        <img src=\"img/MAILMERGE8.jpg\"  loading=\"lazy\" alt=\"MAILMERGE8\">\r\n        8.\tNos pide el nombre de la plantilla guardada, y se puede iniciar la correspondencia respectiva.\r\n\r\n        Para acceder a cambiar el formato fecha se puede de 2 formas:\r\n\r\n        •\tDe da editar sobre el campo, se elije la categoría date con el formato a imprimir, luego se da click sobre el botón Codigos de campo y se agrega la palabra MERGEFIELD “Nombre del campo” luego grabar y se prueba nuevamente, queda similar a MERGEFIELD “ffinal”   \\@ \"dddd, dd' de 'MMMM' de 'yyyy\".\r\n\r\n        El problema es k si se vuelve a consultar se pierde el formato y toca volver a hacerlo, por eso es mejor darle Alt+F9.\r\n\r\n        •\tPara editar la fecha en la carta Word, nos unicamos en el campo: ejemplo {pn-begda}, en el Word se digita Alt+F9 aparece por ejemplo {MERGEFIELD pn-begda} lo que se hace es modificar el formato de salida así: {MERGEFIELD “pn-begda” \\@ “dd MMMM yyyy”} se vuelve y se digita Alt+F9, se graba la plantilla y se prueba nuevamente."},{"id":"rec-51","category":"nomina","title":"COMO CANCELAR UN PRESTAMO EN SAP Se hizo una prueba y se determinó que el procedimiento es e","summary":"COMO CANCELAR UN PRESTAMO EN SAP Se hizo una prueba y se determinó que el procedimiento es el siguiente: A. Se selecciona el préstamo que se desea suspender. B. Se selecciona la función COPI","search":"COMO CANCELAR UN PRESTAMO EN SAP Se hizo una prueba y se determinó que el procedimiento es el siguiente: A. Se selecciona el préstamo que se desea suspender. B. Se selecciona la función COPIAR. C. Se ingresa la fecha inicial y fecha final del tiempo de suspensión NOTA: la fecha inicial obligatoriamente debe corresponder a la fecha inicial de un periodo de nómina; la fecha final obligatoriamente debe ser la fecha final de un periodo de nómina. D. Se debe eliminar la cuota de amortización. E. Se debe eliminar el interés. F. Se deben eliminar los comprometidos. G. Finalmente se debe grabar la modificación Al finalizar el proceso, el préstamo debe quedar dividido en tres partes: Primera parte: préstamo con descuento Segunda parte: préstamo sin descuentos Tercera parte: préstamo con descuento","html":"COMO CANCELAR UN PRESTAMO EN SAP\r\n\r\n        Se hizo una prueba y se determinó que el procedimiento es el siguiente:\r\n\r\n        A.     Se selecciona el préstamo que se desea suspender.\r\n\r\n        B.      Se selecciona la función COPIAR.\r\n\r\n        C.      Se ingresa la fecha inicial y fecha final del tiempo de suspensión\r\n\r\n        NOTA: la fecha inicial obligatoriamente debe corresponder a la fecha inicial de un periodo de nómina; la fecha final obligatoriamente debe ser la fecha final de un periodo de nómina.\r\n\r\n        D.     Se debe eliminar la cuota de amortización.\r\n\r\n        E.      Se debe eliminar el interés.\r\n\r\n        F.      Se deben eliminar los comprometidos.\r\n\r\n        G.     Finalmente se debe grabar la modificación\r\n\r\n\r\n        Al finalizar el proceso, el préstamo debe quedar dividido en tres partes:\r\n\r\n        Primera parte: préstamo con descuento\r\n\r\n        Segunda parte: préstamo sin descuentos\r\n\r\n        Tercera parte: préstamo con descuento"},{"id":"rec-52","category":"abap","title":"RUTA DEL CUSTOMIZING PARA ACTUALIZAR CIUDADES Y DEPARTAMENTOS Gestión financiera (nuevo) -> ","summary":"RUTA DEL CUSTOMIZING PARA ACTUALIZAR CIUDADES Y DEPARTAMENTOS Gestión financiera (nuevo) -> Parametrizaciones básicas de gestión financiera (nuevo) -> Impuesto sobre el volumen de negocios -","search":"RUTA DEL CUSTOMIZING PARA ACTUALIZAR CIUDADES Y DEPARTAMENTOS Gestión financiera (nuevo) -> Parametrizaciones básicas de gestión financiera (nuevo) -> Impuesto sobre el volumen de negocios -> Parametrizaciones básicas -> Códigos fiscales de provincia -> Almacenar códigos fiscales provinciales para Italia, Colombia y España Por SM30 Tabla: V_T005P","html":"RUTA DEL CUSTOMIZING PARA ACTUALIZAR CIUDADES Y DEPARTAMENTOS\r\n\r\n        <img src=\"img/CIUDADES1.jpg\"  loading=\"lazy\" alt=\"CIUDADES1\">\r\n        Gestión financiera (nuevo) -> Parametrizaciones básicas de gestión financiera (nuevo) -> Impuesto sobre el volumen de negocios -> Parametrizaciones básicas -> Códigos fiscales de provincia -> Almacenar códigos fiscales provinciales para Italia, Colombia y España\r\n        Por SM30 Tabla: V_T005P"},{"id":"rec-53","category":"transacciones","title":"CAMBIAR EL NOMBRE DEL TEXTO DEL CAMPO DEL DYNPRO, LOS ELEMENTOS DE TEXTOS, MODIFICAR TEXTOS ","summary":"CAMBIAR EL NOMBRE DEL TEXTO DEL CAMPO DEL DYNPRO, LOS ELEMENTOS DE TEXTOS, MODIFICAR TEXTOS DYNPRO Tabla DDFTX crear vista ZPTV103 indicando tabla, no pide orden, toca ejecutarlas en cada ma","search":"CAMBIAR EL NOMBRE DEL TEXTO DEL CAMPO DEL DYNPRO, LOS ELEMENTOS DE TEXTOS, MODIFICAR TEXTOS DYNPRO Tabla DDFTX crear vista ZPTV103 indicando tabla, no pide orden, toca ejecutarlas en cada mandante, nombre del campo e idioma, ejemplo: P2001 LFZED y S. y activar nuevamente por SE51. Es importante activar también el dynpro 3000. Tabla: DD04T crear una vista de la tabla ZPTV101, no pide orden, toca ejecutarlas en cada mandante, tiene los nombres de los textos que salen en el infotipo y dynpro. Lo que hice fue pero no pide orden de transporte y modifica en algunos lados. • Por SM30 en la vista ZPTV101 por campo actualizar LFZED ES y REFNR ES (Puede no existir) • Por SM30 en la vista ZPTV103 por campo P2001 LFZED S colocar los mismos textos de DEV: Fecha Inc. Fecha Inicial Incap. Fecha Inicial Incap. Fecha Inicial Incapacidad Original • Por SM30 en la vista ZPTV103 por campo P2001 REFNR S colocar los mismos textos de DEV: Nro.Doc. Numero Documento Numero Documento Entidad Numero Doc. Numero Documento Entidad • Activar por SE51 mp200000 por 2008 y por 3000 TABLA DE TEXTOS DE LOS ELEMENTOS DE DATOS: DD04T Ahora bien, el dynpro tiene el objeto creado con el tipo texto, por ejemplo por la tabla anterior se cambia el texto de p0006-state, pero por la SE51 veremos el texto igual. (Este paso no es necesario) Para ello se debe actualizar la tabla: D021T tampoco encontré vista, por lo que se puede crear o pegarle a la tabla directamente (ZV_TEXT_FIELD_DY). Para ello se ingresa: nombre del programa dynpro, el nro del dynpro, el idioma y el nombre del campo: ejemplo: p0006-state. Luego se intenta activar el dynpro por la se51, se reingresa por la transacción PA20 o PA30 y ya queda.","html":"CAMBIAR EL NOMBRE DEL TEXTO DEL CAMPO DEL DYNPRO, LOS ELEMENTOS DE TEXTOS, MODIFICAR TEXTOS DYNPRO\r\n\r\n        Tabla DDFTX crear vista ZPTV103 indicando tabla, no pide orden, toca ejecutarlas en cada mandante, nombre del campo e idioma, ejemplo: P2001 LFZED y S. y activar nuevamente por SE51. Es importante activar también el dynpro 3000.\r\n\r\n        Tabla: DD04T crear una vista de la tabla ZPTV101, no pide orden, toca ejecutarlas en cada mandante, tiene los nombres de los textos que salen en el infotipo y dynpro. Lo que hice fue pero no pide orden de transporte y modifica en algunos lados.\r\n\r\n        •\tPor SM30 en la vista ZPTV101 por campo actualizar LFZED ES y REFNR ES (Puede no existir)\r\n        •\tPor SM30 en la vista ZPTV103 por campo P2001 LFZED S colocar los mismos textos de DEV: Fecha Inc.  Fecha Inicial Incap.  Fecha Inicial Incap. Fecha Inicial Incapacidad Original\r\n        •\tPor SM30 en la vista ZPTV103 por campo P2001 REFNR S colocar los mismos textos de DEV: Nro.Doc.  Numero Documento   Numero Documento Entidad  Numero Doc. Numero Documento Entidad\r\n        •\tActivar por SE51 mp200000 por 2008 y por 3000\r\n        TABLA DE TEXTOS DE LOS ELEMENTOS DE DATOS: DD04T\r\n\r\n        Ahora bien, el dynpro tiene el objeto creado con el tipo texto, por ejemplo por la tabla anterior se cambia el texto de p0006-state, pero por la SE51 veremos el texto igual.\r\n\r\n        (Este paso no es necesario) Para ello se debe actualizar la tabla: D021T tampoco encontré vista, por lo que se puede crear o pegarle a la tabla directamente (ZV_TEXT_FIELD_DY). Para ello se ingresa: nombre del programa dynpro, el nro del dynpro, el idioma y el nombre del campo: ejemplo: p0006-state.   Luego se intenta activar el dynpro por la se51, se reingresa por la transacción PA20 o PA30 y ya queda."},{"id":"rec-54","category":"abap","title":"AGREGAR LINEA EN PARA REVISAR LAS COLISIONES ENTRE INFOTIPOS – ENLACE TEMPORAL V_T554Y","summary":"AGREGAR LINEA EN PARA REVISAR LAS COLISIONES ENTRE INFOTIPOS – ENLACE TEMPORAL V_T554Y","search":"AGREGAR LINEA EN PARA REVISAR LAS COLISIONES ENTRE INFOTIPOS – ENLACE TEMPORAL V_T554Y","html":"AGREGAR LINEA EN PARA REVISAR LAS COLISIONES ENTRE INFOTIPOS – ENLACE TEMPORAL\r\n        V_T554Y"},{"id":"rec-55","category":"abap","title":"CONOCER CONTINGENTE CONSUMIDO POR EL INFOTIPO 2001 a 2006 Básicamente a través del campo DOC","summary":"CONOCER CONTINGENTE CONSUMIDO POR EL INFOTIPO 2001 a 2006 Básicamente a través del campo DOCNR se busca ese numero en la tabla PTQUODED, este contiene el campo QUONR, y el contenido de este ","search":"CONOCER CONTINGENTE CONSUMIDO POR EL INFOTIPO 2001 a 2006 Básicamente a través del campo DOCNR se busca ese numero en la tabla PTQUODED, este contiene el campo QUONR, y el contenido de este campo se busca en el IT2006. * Variables contingentes DATA: int_days_cont TYPE ptmab_q_splits_for_docnr OCCURS 0 WITH HEADER LINE. DATA: zquota_split_tab LIKE tmab_quota_info OCCURS 0 WITH HEADER LINE. * Funcion de desglose de vacaciones. SORT i2001 BY begda vtken DESCENDING beguz. PERFORM quota_split TABLES p2001 USING 'X' CHANGING int_days_cont[]. * funciona LOOP AT int_days_cont. zquota_split[] = int_days_cont-quota_split_tab[]. ENDLOOP. *---------------------------------------------------------------------* * Reads deduction information for absences in P2001 and * determines the split table which is later used to evaluate * T554A (see form QUOTA_VALUATION) *---------------------------------------------------------------------* FORM quota_split TABLES p2001 STRUCTURE p2001 USING parm3 LIKE as-parm3 CHANGING quota_splits_for_docnr_tab TYPE ptmab_q_splits_for_docnr_tab. CLEAR quota_splits_for_docnr_tab. CALL FUNCTION 'HR_QUOTA_SPLITS_FOR_ABSENCE' EXPORTING split_parm = parm3 TABLES i2001 = p2001 CHANGING quota_splits_for_docnr_tab = quota_splits_for_docnr_tab EXCEPTIONS quotas_incomplete = 1. * others = 2. * since function module reads IT2006 via logical data base, there * may have been an authority problem * if sy-subrc = 1 and pnp-sw-auth-skipped-record = '1'. * perform errlog_pab_no_auth_2006(h99plog0) tables error_ptext. * perform errors tables error_ptext. * elseif sy-subrc = 1. * perform errlog_pab_no_2006(h99plog0) tables error_ptext. * perform errors tables error_ptext. * endif. ENDFORM. \"quota_split","html":"CONOCER CONTINGENTE CONSUMIDO POR EL INFOTIPO 2001 a 2006\r\n\r\n        Básicamente a través del campo DOCNR se busca ese numero en la tabla PTQUODED, este contiene el campo QUONR, y el contenido de este campo se busca en el IT2006.\r\n\r\n\r\n        * Variables contingentes\r\n        DATA: int_days_cont     TYPE ptmab_q_splits_for_docnr OCCURS 0 WITH HEADER LINE.\r\n        DATA: zquota_split_tab  LIKE tmab_quota_info          OCCURS 0 WITH HEADER LINE.\r\n\r\n\r\n        * Funcion de desglose de vacaciones.\r\n          SORT i2001 BY begda vtken DESCENDING beguz.\r\n          PERFORM quota_split TABLES p2001\r\n                              USING 'X'\r\n                              CHANGING int_days_cont[].\r\n\r\n        * funciona\r\n          LOOP AT int_days_cont.\r\n            zquota_split[] = int_days_cont-quota_split_tab[].\r\n          ENDLOOP.\r\n\r\n        *---------------------------------------------------------------------*\r\n        *       Reads deduction information for absences in P2001 and\r\n        *       determines the split table which is later used to evaluate\r\n        *       T554A (see form QUOTA_VALUATION)\r\n        *---------------------------------------------------------------------*\r\n        FORM quota_split TABLES p2001 STRUCTURE p2001\r\n                         USING parm3 LIKE as-parm3\r\n                         CHANGING quota_splits_for_docnr_tab\r\n                           TYPE ptmab_q_splits_for_docnr_tab.\r\n          CLEAR quota_splits_for_docnr_tab.\r\n          CALL FUNCTION 'HR_QUOTA_SPLITS_FOR_ABSENCE'\r\n            EXPORTING\r\n              split_parm                 = parm3\r\n            TABLES\r\n              i2001                      = p2001\r\n            CHANGING\r\n              quota_splits_for_docnr_tab = quota_splits_for_docnr_tab\r\n            EXCEPTIONS\r\n              quotas_incomplete          = 1.\r\n        *           others                     = 2.\r\n        * since function module reads IT2006 via logical data base, there\r\n        * may have been an authority problem\r\n        *  if sy-subrc = 1 and pnp-sw-auth-skipped-record = '1'.\r\n        *    perform errlog_pab_no_auth_2006(h99plog0) tables error_ptext.\r\n        *    perform errors tables error_ptext.\r\n        *  elseif sy-subrc = 1.\r\n        *    perform errlog_pab_no_2006(h99plog0) tables error_ptext.\r\n        *    perform errors tables error_ptext.\r\n        *  endif.\r\n        ENDFORM.                    \"quota_split"},{"id":"rec-56","category":"tiempos","title":"CONOCER EL CONTINGENTE CONSUMIDO 2001 - 2006 HR_QUOTAS_DEDUCTED_BY_DOCNR","summary":"CONOCER EL CONTINGENTE CONSUMIDO 2001 - 2006 HR_QUOTAS_DEDUCTED_BY_DOCNR","search":"CONOCER EL CONTINGENTE CONSUMIDO 2001 - 2006 HR_QUOTAS_DEDUCTED_BY_DOCNR","html":"CONOCER EL CONTINGENTE CONSUMIDO 2001 - 2006\r\n        HR_QUOTAS_DEDUCTED_BY_DOCNR"},{"id":"rec-57","category":"transacciones","title":"CONSULTAR TODAS LAS TRANSACCIONES DE HR Reporte RPDTRA00","summary":"CONSULTAR TODAS LAS TRANSACCIONES DE HR Reporte RPDTRA00","search":"CONSULTAR TODAS LAS TRANSACCIONES DE HR Reporte RPDTRA00","html":"CONSULTAR TODAS LAS TRANSACCIONES DE HR\r\n\r\n        Reporte RPDTRA00"},{"id":"rec-58","category":"transacciones","title":"PERMITIR CALCULO DE NOMINA SIN MODIFICAR PA03 Tabla T000 para dejar el mandante como Test y ","summary":"PERMITIR CALCULO DE NOMINA SIN MODIFICAR PA03 Tabla T000 para dejar el mandante como Test y deje modificar, para hacer calculo de nomina sin que pida modificar registro de gestión, se coment","search":"PERMITIR CALCULO DE NOMINA SIN MODIFICAR PA03 Tabla T000 para dejar el mandante como Test y deje modificar, para hacer calculo de nomina sin que pida modificar registro de gestión, se comentarea la línea: CHECK ABR * Verificación mediante, que se encuentra en el esquema de calculo, en el subesquema inicialización Nomina.","html":"PERMITIR CALCULO DE NOMINA SIN MODIFICAR PA03\r\n\r\n        Tabla T000 para dejar el mandante como Test y deje modificar, para hacer calculo de nomina sin que pida modificar registro de gestión, se comentarea la línea:\r\n\r\n        CHECK      ABR            * Verificación mediante, que se encuentra en el esquema de calculo, en el subesquema inicialización Nomina."},{"id":"rec-59","category":"abap","title":"PARA AJUSTAR DYNPRO MP200000 CON 2450 PARA EL INFOTIPO 2010 RECIBOS DE SALARIOS","summary":"PARA AJUSTAR DYNPRO MP200000 CON 2450 PARA EL INFOTIPO 2010 RECIBOS DE SALARIOS. El ajuste de los campos del dynpro se efectúa en la vista V_T588M de la SM30, ya que por adaptación de superf","search":"PARA AJUSTAR DYNPRO MP200000 CON 2450 PARA EL INFOTIPO 2010 RECIBOS DE SALARIOS. El ajuste de los campos del dynpro se efectúa en la vista V_T588M de la SM30, ya que por adaptación de superficies no permite. Se elige MP200000 y luego 2450.","html":"PARA AJUSTAR DYNPRO MP200000 CON 2450 PARA EL INFOTIPO 2010 RECIBOS DE SALARIOS.\r\n\r\n        El ajuste de los campos del dynpro se efectúa en la vista V_T588M de la SM30, ya que por adaptación de superficies no permite.\r\n        Se elige MP200000 y luego 2450."},{"id":"rec-60","category":"abap","title":"NECESIDADES DE LA PP61 – PROPUESTA DE NECESIDADES Revisar Customizing, en la parte de planif","summary":"NECESIDADES DE LA PP61 – PROPUESTA DE NECESIDADES Revisar Customizing, en la parte de planificación de turnos… Básicamente la propuesta con SAP_1 funciona... Active SAP_2 con estas opciones ","search":"NECESIDADES DE LA PP61 – PROPUESTA DE NECESIDADES Revisar Customizing, en la parte de planificación de turnos… Básicamente la propuesta con SAP_1 funciona... Active SAP_2 con estas opciones y funciona bien… Se crean las necesidades por la transacción PP67 – Crear Y con el icono se crea la propuesta automáticamente para todos los empleados, Pero si se quiere mas personalizado… se elige un empleado luego una asignación en la parte inferior y se da el icono y solo se le asigna a esta persona… Se puede jugar con la opciones de esta ventana, pero la mostrada es la k adapta todo el horario a la persona.","html":"NECESIDADES DE LA PP61 – PROPUESTA DE NECESIDADES\r\n\r\n        Revisar Customizing, en la parte de planificación de turnos… Básicamente la propuesta con SAP_1 funciona...\r\n\r\n        Active SAP_2 con estas opciones y funciona bien…\r\n        <img src=\"img/PP611.jpg\"  loading=\"lazy\" alt=\"PP611\">\r\n\r\n        Se crean las necesidades por la transacción PP67 – Crear\r\n\r\n        Y con el icono <img src=\"img/PP612.jpg\"  loading=\"lazy\" alt=\"PP612\">  se crea la propuesta automáticamente para todos los empleados,\r\n        Pero si se quiere mas personalizado… se elige un empleado luego una asignación en la parte inferior y se da el icono <img src=\"img/PP613.jpg\"  loading=\"lazy\" alt=\"PP613\">  y solo se le asigna a esta persona…\r\n        <img src=\"img/PP614.jpg\"  loading=\"lazy\" alt=\"PP614\">\r\n\r\n        Se puede jugar con la opciones de esta ventana, pero la mostrada es la k adapta todo el horario a la persona."},{"id":"rec-61","category":"tiempos","title":"CONTROLAR LA FECHA DE LA PRIMERA EVALUACIÓN DE TIEMPOS - PT60 SIN NECESIDAD DE CARGAR IT0019","summary":"CONTROLAR LA FECHA DE LA PRIMERA EVALUACIÓN DE TIEMPOS - PT60 SIN NECESIDAD DE CARGAR IT0019 Y DEJAR LA FECHA ORIGINAL DEL IT0041 CON CLASE 25 En la la tabla V_T569R por el código 02 Evaluac","search":"CONTROLAR LA FECHA DE LA PRIMERA EVALUACIÓN DE TIEMPOS - PT60 SIN NECESIDAD DE CARGAR IT0019 Y DEJAR LA FECHA ORIGINAL DEL IT0041 CON CLASE 25 En la la tabla V_T569R por el código 02 Evaluación de tiempos, cree una clave 90, en la cual se debe colocar la fecha de salida en vivo, eventualmente puede uno crear para cada país esa fecha nunca podrá ser modificada. En el cliente texmoda en el INCLUDE LRPPDF70 - RPTIME00 se encuentra la ampliación.","html":"CONTROLAR LA FECHA DE LA PRIMERA EVALUACIÓN DE TIEMPOS - PT60\r\n        SIN NECESIDAD DE CARGAR IT0019 Y DEJAR LA FECHA ORIGINAL DEL IT0041 CON CLASE 25\r\n\r\n        En la la tabla V_T569R por el código 02 Evaluación de tiempos, cree una clave 90, en la cual se debe colocar la fecha de salida en vivo, eventualmente puede uno crear para cada país esa fecha nunca podrá ser modificada.\r\n        En el cliente texmoda en el INCLUDE LRPPDF70 - RPTIME00 se encuentra la ampliación."},{"id":"rec-62","category":"tiempos","title":"PARA LA PRIMERA EVALUACIÓN DE TIEMPOS PARA SOLO CONTINGENTES - PT60","summary":"PARA LA PRIMERA EVALUACIÓN DE TIEMPOS PARA SOLO CONTINGENTES - PT60: Se copia el esquema TQTA como ZQTA: Importante colocar en este esquema la regla ZMON. Se llena con las siguientes líneas:","search":"PARA LA PRIMERA EVALUACIÓN DE TIEMPOS PARA SOLO CONTINGENTES - PT60: Se copia el esquema TQTA como ZQTA: Importante colocar en este esquema la regla ZMON. Se llena con las siguientes líneas: CHECK NEG Toma solo empleados con status 9 SIN CHECK NEG Toma solo empleados con status 1 En la norma de generación de contingente se indica el el subtipo del infotipo 0019 que servirá como fecha de inicio para la acumulación de contingentes. En el it0019 con subtipo 90, de cada empleado debe haber un registro con la fecha de inicio de acumulación, ejemplo: Recordar que el calculo de acumulación lo hace para los empleados así: Dias de derecho al año / numero de dias naturales = acumulado contingente, luego valida con el derecho máximo. Ejemplo: 15 (dias de derecho al año) / 183 dias naturales (10/04/2010 - 09/10/2010) = 0,08196721 Por lo tanto eso es lo k acumula para que de exactamente 15. Como derecho máximo se coloco: 0,08219 Después de ejecutar este esquema para la salida en vivo, Ajustar la tabla V_T569R con tipo de retroactividad 02 para que quede con la fecha de salida en vivo, una vez efectuada la liquidación de tiempos con esquema ZQTA, esto para que no se ejecute la evaluación de tiempos antes de la fecha de salida en vivo (01.11.2010).","html":"PARA LA PRIMERA EVALUACIÓN DE TIEMPOS PARA SOLO CONTINGENTES - PT60:\r\n\r\n        Se copia el esquema TQTA como ZQTA:\r\n\r\n        Importante colocar en este esquema la regla ZMON.\r\n\r\n        Se llena con las siguientes líneas:\r\n        <img src=\"img/PT601.jpg\"  loading=\"lazy\" alt=\"PT601\">\r\n        CHECK NEG Toma solo empleados con status 9\r\n        SIN CHECK NEG Toma solo empleados con status 1\r\n\r\n        En la norma de generación de contingente se indica el el subtipo del infotipo 0019 que servirá como fecha de inicio para la acumulación de contingentes.\r\n        <img src=\"img/PT602.jpg\"  loading=\"lazy\" alt=\"PT602\">\r\n        En el it0019 con subtipo 90, de cada empleado debe haber un registro con la fecha de inicio de acumulación, ejemplo:\r\n        <img src=\"img/PT603.jpg\"  loading=\"lazy\" alt=\"PT603\">\r\n        <img src=\"img/PT604.jpg\"  loading=\"lazy\" alt=\"PT604\">\r\n        Recordar que el calculo de acumulación lo hace para los empleados así:\r\n\r\n        Dias de derecho al año / numero de dias naturales = acumulado contingente, luego valida con el derecho máximo.\r\n\r\n        Ejemplo:\r\n        15 (dias de derecho al año) / 183 dias naturales (10/04/2010 - 09/10/2010) = 0,08196721\r\n        Por lo tanto eso es lo k acumula para que de exactamente 15. Como derecho máximo se coloco: 0,08219\r\n\r\n        Después de ejecutar este esquema para la salida en vivo, Ajustar la tabla V_T569R con tipo de retroactividad 02 para que quede con la fecha de salida en vivo, una vez efectuada la liquidación de tiempos con esquema ZQTA, esto para que no se ejecute la evaluación de tiempos antes de la fecha de salida en vivo (01.11.2010)."},{"id":"rec-63","category":"tiempos","title":"PARA QUE EL SISTEMA PERMITA CONTINGENTES NEGATIVOS AL INGRESAR EN IT 2001 Ingresar el valor "
