o Eso aumenta automaticamente, no sera necesario evaluar tiempos, para ver mas configuracion mirar cliente Textmoda. o NOTA: El motivo por el cual no funciona ingresar valores en el IT2013 es porque la norma, indica que se genera maximo un valor de contingente, para el ejemplo 30 y así yo aumente, el sistema nunca pasara de ahí. • Si se deben disminuir, se ingresa al IT2013, por el subtipo 91 (O a la PT50 y tomar el dia que se quiera ajustar). o Se ingresa la cantidad a disminuir en ese año. o Se escoje la opción reducir, y se evalua tiempos, con eso ya se ajusta el contingente final de ese año.","html":"PARA EL MANEJO DEL AJUSTE DEL CONTINGENTE P2006 LAS VACACIONES SE DEBE DIFERENCIAR ENTRE SI SE DEBE AUMENTAR O DISMINUIR:\r\n\r\n        •\tSi se deben aumentar, se debe ingresar en al infotipo 2006 con subtipo 91 Ajuste + Vacac. 30 dias.\r\n        o\tEl campo cantidad estará habilitado para ingresar la cantidad a ajustar, se debe indicar una fecha reciente, pero no es problema, ya que la configuración permitirá que siempre se consuma este contingente primero que el 90 Vacaciones 30 dias\r\n        o\tLa configuración que hace que\r\n        o\t Primero se agote el contingente 91 es:\r\n        <img src=\"img/CONTINGENTES4.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES4\">\r\n        <img src=\"img/CONTINGENTES5.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES5\">\r\n        o\tEso aumenta automaticamente, no sera necesario evaluar tiempos, para ver mas configuracion mirar cliente Textmoda.\r\n        o\tNOTA: El motivo por el cual no funciona ingresar valores en el IT2013 es porque la norma, indica que se genera maximo un valor de contingente, para el ejemplo 30 y así yo aumente, el sistema nunca pasara de ahí.\r\n\r\n        •\tSi se deben disminuir, se ingresa al IT2013, por el subtipo 91 (O a la PT50 y tomar el dia que se quiera ajustar).\r\n        o\tSe ingresa la cantidad a disminuir en ese año.\r\n        o\tSe escoje la opción reducir, y se evalua tiempos, con eso ya se ajusta el contingente final de ese año."},{"id":"rec-65","category":"tiempos","title":"CALCULO VACACIONES PARA QUE TOME DIAS CONTINGENTE PARA EMPLEADOS LUNES A VIERNES Y LUNES A S","summary":"CALCULO VACACIONES PARA QUE TOME DIAS CONTINGENTE PARA EMPLEADOS LUNES A VIERNES Y LUNES A SÁBADO 2006","search":"CALCULO VACACIONES PARA QUE TOME DIAS CONTINGENTE PARA EMPLEADOS LUNES A VIERNES Y LUNES A SÁBADO 2006","html":"CALCULO VACACIONES PARA QUE TOME DIAS CONTINGENTE PARA EMPLEADOS LUNES A VIERNES Y LUNES A SÁBADO 2006\r\n        <img src=\"img/CONTINGENTES6.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES6\">\r\n        <img src=\"img/CONTINGENTES7.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES7\">\r\n        <img src=\"img/CONTINGENTES8.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES8\">\r\n        <img src=\"img/CONTINGENTES9.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES9\">\r\n        <img src=\"img/CONTINGENTES10.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES10\">\r\n        <img src=\"img/CONTINGENTES11.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES11\">\r\n        <img src=\"img/CONTINGENTES12.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES12\">\r\n        <img src=\"img/CONTINGENTES13.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES13\">\r\n        <img src=\"img/CONTINGENTES14.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES14\">\r\n        <img src=\"img/CONTINGENTES15.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES15\">\r\n        <img src=\"img/CONTINGENTES16.jpg\"  loading=\"lazy\" alt=\"CONTINGENTES16\">"},{"id":"rec-66","category":"abap","title":"CALCULO DE DIAS IT2006 PARA CARGUE INICIAL - VACACIONES • En la tabla V_T569R por el tipo 02","summary":"CALCULO DE DIAS IT2006 PARA CARGUE INICIAL - VACACIONES • En la tabla V_T569R por el tipo 02 Evaluación tiempos se configura para el cargue: o Para el modif 01 con fecha 01.01.2000 o Se crea","search":"CALCULO DE DIAS IT2006 PARA CARGUE INICIAL - VACACIONES • En la tabla V_T569R por el tipo 02 Evaluación tiempos se configura para el cargue: o Para el modif 01 con fecha 01.01.2000 o Se crea un modif 90 con el dia de salida en vivo o fecha de cargue para pruebas. es decir el dia 01 del mes. • En el include LRPPDF70 del programa RPTIME00 se efectúa una ampliación: ENHANCEMENT 1 ZENHHCM_RPTIME00_02. \"active version \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(18) Forma RE569R, Inicio, Ampliación ZENHHCM_RPTIME00_02, Inicio A ** Ampliacion en el include LRPPDF70 al inicio del FORM RE569R ** Para que a partir de la tabla V_T569R con clave 02 y subtipo 90 Fecha salida en vivo ** Permita la acumulacion del periodo unicamente sobre la salida en vivo. IF re_pvrrt = '02'. DATA: gv_molga TYPE molga. GET PARAMETER ID 'MOL' FIELD gv_molga. IF gv_molga = 'PE'. \"Unicamente para peru SELECT SINGLE * FROM t569r WHERE modif EQ '90' AND pvrrt EQ re_pvrrt. IF sy-subrc NE 0. \"keine RR-Tiefe angeben ->initial CLEAR t569r. ENDIF. DATA: ti_p0041 TYPE STANDARD TABLE OF p0041, gv_fecinicontrol TYPE begda, gv_rrdat TYPE begda, gv_siencontro TYPE c, BEGIN OF var0041, dar LIKE p0041-dar01, dat LIKE p0041-dat01, END OF var0041. CLEAR: gv_siencontro. ti_p0041[] = p0041[]. gv_rrdat = t569r-rrdat. DO 10 TIMES VARYING var0041-dar FROM p0041-dar01 NEXT p0041-dar02 VARYING var0041-dat FROM p0041-dat01 NEXT p0041-dat02. IF var0041-dar EQ '25'. IF var0041-dat => t569r-rrdat. \"Si es Mayor o igual a la salida en Vivo, no haga nada ELSE. t569r-rrdat = var0041-dat. t569r-rrdat(4) = gv_rrdat(4). IF t569r-rrdat > gv_rrdat. t569r-rrdat(4) = t569r-rrdat(4) - 1. ENDIF. gv_siencontro = abap_true. EXIT. ENDIF. ENDIF. ENDDO. IF gv_siencontro = abap_true. EXIT. ENDIF. ENDIF. ENDIF. \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(20) Forma RE569R, Inicio, Ampliación ZENHHCM_RPTIME00_02, Final A ENDENHANCEMENT. • De igual forma hay que efectuar esta ampliación en el programa SAPLRPRR INCLUDE LRPRRF04 para que permita limitar los contingente del it2006: ENHANCEMENT 1 . *** Ampliación en el programa SAPLRPRR include LRPRRF04 Al inicio del FORM CHECK_TWM_TIME *** para que en tiempos deje limitar los registros antes de la fecha S.en.vivo HRP IF P_MOLGA = 'PE' AND ( SY-TCODE = 'PA30' OR SY-TCODE = 'PA40' ). DATA: GV_RRDAT TYPE BEGDA. SELECT SINGLE RRDAT INTO GV_RRDAT FROM T569R WHERE MODIF = '90' AND PVRRT = '02'. IF GV_RRDAT IS NOT INITIAL. IF P_RETRO_DATE","html":"CALCULO DE DIAS IT2006 PARA CARGUE INICIAL - VACACIONES\r\n\r\n\r\n        •\tEn la tabla V_T569R por el tipo 02 Evaluación tiempos se configura para el cargue:\r\n        o\tPara el modif 01 con fecha 01.01.2000\r\n        o\tSe crea un modif 90 con el dia de salida en vivo o fecha de cargue para pruebas. es decir el dia 01 del mes.\r\n        •\tEn el include LRPPDF70 del programa RPTIME00 se efectúa una ampliación:\r\n        ENHANCEMENT 1  ZENHHCM_RPTIME00_02.    \"active version\r\n        \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(18) Forma RE569R, Inicio, Ampliación ZENHHCM_RPTIME00_02, Inicio                                                                                     A\r\n        ** Ampliacion en el include LRPPDF70 al inicio del FORM RE569R\r\n        ** Para que a partir de la tabla V_T569R con clave 02 y subtipo 90 Fecha salida en vivo\r\n        ** Permita la acumulacion del periodo unicamente sobre la salida en vivo.\r\n\r\n        IF re_pvrrt        = '02'.\r\n          DATA: gv_molga   TYPE molga.\r\n          GET PARAMETER ID 'MOL' FIELD gv_molga.\r\n          IF gv_molga      = 'PE'.  \"Unicamente para peru\r\n            SELECT SINGLE * FROM t569r\r\n              WHERE modif EQ '90'\r\n                AND pvrrt EQ re_pvrrt.\r\n            IF sy-subrc NE 0.                  \"keine RR-Tiefe angeben ->initial\r\n              CLEAR t569r.\r\n            ENDIF.\r\n            DATA: ti_p0041         TYPE STANDARD TABLE OF p0041,\r\n                  gv_fecinicontrol TYPE begda,\r\n                  gv_rrdat         TYPE begda,\r\n                  gv_siencontro    TYPE c,\r\n\r\n                  BEGIN OF var0041,\r\n                        dar LIKE p0041-dar01,\r\n                        dat LIKE p0041-dat01,\r\n                  END OF var0041.\r\n            CLEAR: gv_siencontro.\r\n            ti_p0041[]          = p0041[].\r\n            gv_rrdat            = t569r-rrdat.\r\n            DO 10 TIMES VARYING var0041-dar FROM p0041-dar01\r\n                           NEXT p0041-dar02\r\n                        VARYING var0041-dat FROM p0041-dat01\r\n                           NEXT p0041-dat02.\r\n              IF var0041-dar         EQ '25'.\r\n                IF var0041-dat      => t569r-rrdat. \"Si es Mayor o igual a la salida en Vivo, no haga nada\r\n                ELSE.\r\n                  t569r-rrdat      = var0041-dat.\r\n                  t569r-rrdat(4)   = gv_rrdat(4).\r\n                  IF t569r-rrdat   > gv_rrdat.\r\n                    t569r-rrdat(4) = t569r-rrdat(4) - 1.\r\n                  ENDIF.\r\n                  gv_siencontro    = abap_true.\r\n                  EXIT.\r\n                ENDIF.\r\n              ENDIF.\r\n            ENDDO.\r\n            IF gv_siencontro         = abap_true.\r\n              EXIT.\r\n            ENDIF.\r\n          ENDIF.\r\n        ENDIF.\r\n        \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(20) Forma RE569R, Inicio, Ampliación ZENHHCM_RPTIME00_02, Final                                                                                      A\r\n        ENDENHANCEMENT.\r\n\r\n        •\tDe igual forma hay que efectuar esta ampliación  en el programa SAPLRPRR INCLUDE LRPRRF04 para que permita limitar los contingente del it2006:\r\n        ENHANCEMENT 1  .\r\n        *** Ampliación en el programa SAPLRPRR include LRPRRF04 Al inicio del FORM CHECK_TWM_TIME\r\n        ***  para que en tiempos deje limitar los registros antes de la fecha S.en.vivo HRP\r\n          IF P_MOLGA         = 'PE' AND\r\n             ( SY-TCODE      = 'PA30' OR\r\n               SY-TCODE      = 'PA40' ).\r\n             DATA: GV_RRDAT  TYPE BEGDA.\r\n             SELECT SINGLE RRDAT INTO GV_RRDAT FROM T569R\r\n                                               WHERE MODIF = '90' AND\r\n                                                     PVRRT = '02'.\r\n             IF GV_RRDAT        IS NOT INITIAL.\r\n                IF P_RETRO_DATE < GV_RRDAT.\r\n                   P_RETRO_DATE = GV_RRDAT.\r\n                ENDIF.\r\n             ENDIF.\r\n          ENDIF.\r\n\r\n        ENDENHANCEMENT.\r\n\r\n        •\tEn la tabla V_556A_B, el contingente debe estar en la opción Aumentar.\r\n        •\tSe ejecuta la PT60 con retroactividad un año atrás a la fecha de corte o salida en vivo y el ESQUEMA ZQTA.\r\n        •\tSe efectúan los ajustes correspondientes hasta que no salgan errores al liquidar tiempos.\r\n\r\n        Después de ejecutar la PT60\r\n        •\tSe habilita en la tabla V_556A_B, el contingente para que permita ingresar cantidad, es decir se deja en Sin generar.\r\n        •\tSe ejecuta programa de cargue: solo se ingresan los registros de periodos anteriores y la cantidad que estén pendientes por tomar del empleado. Programa ZHCM_TMS_BI2006 en Texmoda\r\n\r\n        •\tSe efectúan los ajustes correspondientes hasta que se carguen.\r\n        •\tDespués del cargue de registro IT2006, En la tabla V_556A_B, el contingente debe estar en la opción Aumentar.\r\n        •\tPor ultimo en la tabla:\r\n        •\tEn la tabla V_T569R por el tipo 02 Evaluación tiempos se configura para el cargue:\r\n        o\tPara el modif 01 con el dia anterior a la fecha de salida en vivo.\r\n        o\tSe crea un modif 90 con fecha de salida en vivo o fecha de cargue para pruebas.\r\n        •\tEjecutar programa RPUTRBK0 para que con fecha PDC Recalculation quede con la fecha de salida en vivo. Recordar quitar check de Test.\r\n        •\tEs importante que en la tabla V_T582A el infotipo 2001 y 2006 se quite el check del campo Actual.pas.adm. este campo debe ir en blanco para que al limitar IT 2006 en retiro, genera error.\r\n        <img src=\"img/V_T582A1.jpg\"  loading=\"lazy\" alt=\"V_T582A1\">\r\n        <img src=\"img/V_T582A2.jpg\"  loading=\"lazy\" alt=\"V_T582A2\">"},{"id":"rec-67","category":"nomina","title":"VARIABLE DE DEBUG DE VACACIONES EN CALCULO DE NOMINA SIM_VAC","summary":"VARIABLE DE DEBUG DE VACACIONES EN CALCULO DE NOMINA SIM_VAC: Cuando esta en X esta haciendo la simulación del calculo de nomina para los periodos de vacaciones.","search":"VARIABLE DE DEBUG DE VACACIONES EN CALCULO DE NOMINA SIM_VAC: Cuando esta en X esta haciendo la simulación del calculo de nomina para los periodos de vacaciones.","html":"VARIABLE DE DEBUG DE VACACIONES EN CALCULO DE NOMINA\r\n\r\n        SIM_VAC: Cuando esta en X esta haciendo la simulación del calculo de nomina para los periodos de vacaciones."},{"id":"rec-68","category":"abap","title":"PARA QUE EN RETRO NO RECALCULE, PORQUE DEVUELVE LOS VALORES YA CALCULADOS DE LA SEGURIDAD SO","summary":"PARA QUE EN RETRO NO RECALCULE, PORQUE DEVUELVE LOS VALORES YA CALCULADOS DE LA SEGURIDAD SOCIAL IF gl_no_calc NE pco00_check.","search":"PARA QUE EN RETRO NO RECALCULE, PORQUE DEVUELVE LOS VALORES YA CALCULADOS DE LA SEGURIDAD SOCIAL IF gl_no_calc NE pco00_check.","html":"PARA QUE EN RETRO NO RECALCULE, PORQUE DEVUELVE LOS VALORES YA CALCULADOS DE LA SEGURIDAD SOCIAL\r\n\r\n        IF gl_no_calc         NE pco00_check."},{"id":"rec-69","category":"abap","title":"GENERACIÓN DE PRUEBAS EN CON STWB_2 - Gestión plan de test EJECUCION DE LAS PRUEBAS DOCUMENT","summary":"GENERACIÓN DE PRUEBAS EN CON STWB_2 - Gestión plan de test EJECUCION DE LAS PRUEBAS DOCUMENTADAS STWB_WORK - Usuario q.ejecuta test pool trabajo","search":"GENERACIÓN DE PRUEBAS EN CON STWB_2 - Gestión plan de test EJECUCION DE LAS PRUEBAS DOCUMENTADAS STWB_WORK - Usuario q.ejecuta test pool trabajo","html":"GENERACIÓN DE PRUEBAS EN CON STWB_2 - Gestión plan de test\r\n\r\n        EJECUCION DE LAS PRUEBAS DOCUMENTADAS STWB_WORK - Usuario q.ejecuta test pool trabajo"},{"id":"rec-70","category":"transacciones","title":"ASIGNACIÓN DE PERFIL PTMW A USUARIO La asignación de un perfil a un usuario puede llevarse a","summary":"ASIGNACIÓN DE PERFIL PTMW A USUARIO La asignación de un perfil a un usuario puede llevarse a cabo de dos maneras: • mediante Crear transacción de parámetros, que el usuario incluye en una fu","search":"ASIGNACIÓN DE PERFIL PTMW A USUARIO La asignación de un perfil a un usuario puede llevarse a cabo de dos maneras: • mediante Crear transacción de parámetros, que el usuario incluye en una función; • a través del parametro de usuario PT_TMW_PROFILE. Si no desea asignar un perfil a un usuario a través de una función, hagalo a través del parámetro de usuario PT_TMW_PROFILE. Si un usuario, al que no se ha asignado ningún perfil a través de función o a través de parámetro de usuario, llama al Puesto de trabajo de gestión de tiempos, debe seleccionarse un perfil de la ventana de diálogo. El perfil que aquí se seleccione se introducirá en el sistema como su parámetro de usuario. El administrador de tiempos puede actualizar el parámetro de usuario a través del menú: Sistema -> Valores prefijados -> Datos propios -> Parámetro. Aquí introduce PT_TMW_PROFILE en Parámetro y la denominación de perfil en Valor. Cuando un usuario tiene asignado un perfil a través de una función y a través de los parámetros de usuario, los datos de la función prevalecen sobre los parámetros de usuario. Tan pronto como tiene lugar la asignación de usuario, el administrador de tiempos puede llamar al puesto de trabajo de gestión de tiempos automáticamente con el perfil que contiene toda la información relevante y los ámbitos de función requeridos. Notas En el sistema estándar, SAP incorpora tres perfiles con sus correspondientes transacciones de parámetros: Perfil Transacción de parámetro SAP_XX_TIME_ADMIN PTMW_TIME_ADMIN (administrar indicaciones horarias) SAP_XX_TIME_AD_GRP PTMW_TIME_ADMIN_GRP (administrar indicaciones horarias para grupos) SAP_XX_WORKLIST PTMW_WORKLIST (tratar mensajes) Ejemplo: SAP_US_TIME_ADMIN SAP_38_TIME_ADMIN","html":"ASIGNACIÓN DE PERFIL PTMW A USUARIO\r\n        La asignación de un perfil a un usuario puede llevarse a cabo de dos maneras:\r\n        •\tmediante Crear transacción de parámetros, que el usuario incluye en una función;\r\n        •\ta través del parametro de usuario PT_TMW_PROFILE.\r\n        Si no desea asignar un perfil a un usuario a través de una función, hagalo a través del parámetro de usuario PT_TMW_PROFILE.\r\n        Si un usuario, al que no se ha asignado ningún perfil a través de función o a través de parámetro de usuario, llama al Puesto de trabajo de gestión de tiempos, debe seleccionarse un perfil de la ventana de diálogo. El perfil que aquí se seleccione se introducirá en el sistema como su parámetro de usuario.\r\n        El administrador de tiempos puede actualizar el parámetro de usuario a través del menú: Sistema -> Valores prefijados -> Datos propios -> Parámetro. Aquí introduce PT_TMW_PROFILE en Parámetro y la denominación de perfil en Valor.\r\n        Cuando un usuario tiene asignado un perfil a través de una función y a través de los parámetros de usuario, los datos de la función prevalecen sobre los parámetros de usuario.\r\n        Tan pronto como tiene lugar la asignación de usuario, el administrador de tiempos puede llamar al puesto de trabajo de gestión de tiempos automáticamente con el perfil que contiene toda la información relevante y los ámbitos de función requeridos.\r\n        Notas\r\n        En el sistema estándar, SAP incorpora tres perfiles con sus correspondientes transacciones de parámetros:\r\n        Perfil\tTransacción de parámetro\r\n        SAP_XX_TIME_ADMIN\tPTMW_TIME_ADMIN (administrar indicaciones horarias)\r\n        SAP_XX_TIME_AD_GRP\tPTMW_TIME_ADMIN_GRP (administrar indicaciones horarias para grupos)\r\n        SAP_XX_WORKLIST\tPTMW_WORKLIST (tratar mensajes)\r\n        Ejemplo: SAP_US_TIME_ADMIN\r\n        SAP_38_TIME_ADMIN"},{"id":"rec-71","category":"transacciones","title":"MANEJO DEL SERVIDOR SOLMAN SOLAR01 Plano empresarial","summary":"MANEJO DEL SERVIDOR SOLMAN SOLAR01 Plano empresarial: para ingresar la estructura de que se va a manejar de configuración y de transacciones. Ejemplo: Dentro de Unidades organizativas, en la","search":"MANEJO DEL SERVIDOR SOLMAN SOLAR01 Plano empresarial: para ingresar la estructura de que se va a manejar de configuración y de transacciones. Ejemplo: Dentro de Unidades organizativas, en la pestaña estructura se incluyen las pestañas a manejar. Otro caso: En este ejemplo dentro de planes horario de trabajo, se colocar las transacciones de configuración en la pestaña configuración. Las transacciones del menú Easy-access que prueba el usuario en la pestaña transacciones: Toda la configuración y documentación del consultor siempre se ejecuta desde la transacción SOLAR02 ya que esta es la transacción donde se lleva el registro de las actividades efectuadas. Ejemplo: La documentación proyectos sobre la carpeta proyectos de la raíz. Ejemplo: En la pestaña gestión se colocan las fechas programadas y reales (Es mejor alimentarlos del Project, ya que este no maneja festivos ni fines de semana). Ejemplo: Para validar las pruebas unitarias o integrales: Se graba el catalogo por STWB_1 - Gestión de catálogo de test, no se como funciona. Para que un usuario lo pueda ver, se ejecuta la primera vez la transacción STWB_2 - Gestión plan de test: Si no aparece nada, se da click en gestión de favoritos. Toda la información siguiente siempre en blanco: Luego el signo + , luego reloj , ahí deben aparecer los catalogos cargados, escojemos el que nos corresponda, ejemplo: Una vez grabado y adicionado en el primer menú. Damos doble click en para elegir el proyecto que se carga en la parte de arriba. A continuación damos click en icono Paquetes de test . Ahí aparecen todos los proyectos, pero elegimos solo el de nosotros, ejemplo: Damos click en el icono asignación de responsables. y agregamos el usuario al modulo respectivo. Una vez hecho lo anterior, ya se puede ejecutar la transacción STWB_WORK - Usuario q.ejecuta test pool trabajo, en donde le aparecen las transacciones que debe probar el usuario, en el icono ejecutar invoca el servidor de pruebas, pero previamente alguien lo debió configurar. Ejemplo: Una vez cargadas todas las transacciones que debe probar el usuario, y si se requiere adicionar mas se debe: - Agregar la transacción por SOLAR02 - Ingresar por STWB_2 - Gestión plan de test 1. Dar click en para seleccionar el proyecto y quede en la parte de arriba. 2. Se da lápiz para modificar 3. Se despliega todo el árbol, y se marca con Check la nueva transacción adicionada, y se genera. 4. Nos devolvemos de la opción si salirnos y damos click en el icono paquetes de test . 5. Se elije el respectivo modulo dando click sobre el modulo. 6. Se da lápiz y se genera. Ejemplo: Y ya debe aparecer dentro de los escenarios de pruebas.","html":"MANEJO DEL SERVIDOR SOLMAN\r\n\r\n        SOLAR01 Plano empresarial: para ingresar la estructura de que se va a manejar de configuración y de transacciones.\r\n\r\n        Ejemplo:\r\n\r\n        Dentro de  Unidades organizativas, en la pestaña estructura se incluyen las pestañas a manejar.\r\n        <img src=\"img/SOLMAN1.jpg\"  loading=\"lazy\" alt=\"SOLMAN1\">\r\n        Otro caso:\r\n        <img src=\"img/SOLMAN2.jpg\"  loading=\"lazy\" alt=\"SOLMAN2\">\r\n        En este ejemplo dentro de planes horario de trabajo, se colocar las transacciones de configuración en la pestaña configuración.\r\n        <img src=\"img/SOLMAN3.jpg\"  loading=\"lazy\" alt=\"SOLMAN3\">\r\n        Las transacciones del menú Easy-access que prueba el usuario en la pestaña transacciones:\r\n        <img src=\"img/SOLMAN4.jpg\"  loading=\"lazy\" alt=\"SOLMAN4\">\r\n\r\n        Toda la configuración y documentación del consultor siempre se ejecuta desde la transacción SOLAR02 ya que esta es la transacción donde se lleva el registro de las actividades efectuadas.\r\n        Ejemplo:\r\n        <img src=\"img/SOLMAN5.jpg\"  loading=\"lazy\" alt=\"SOLMAN5\">\r\n        La documentación proyectos sobre la carpeta proyectos de la raíz.\r\n        Ejemplo:\r\n        <img src=\"img/SOLMAN6.jpg\"  loading=\"lazy\" alt=\"SOLMAN6\">\r\n        En la pestaña gestión se colocan las fechas programadas y reales (Es mejor alimentarlos del Project, ya que este no maneja festivos ni fines de semana).\r\n        Ejemplo:\r\n        <img src=\"img/SOLMAN7.jpg\"  loading=\"lazy\" alt=\"SOLMAN7\">\r\n        Para validar las pruebas unitarias o integrales:\r\n\r\n        Se graba el catalogo por STWB_1 - Gestión de catálogo de test, no se como funciona.\r\n\r\n        Para que un usuario lo pueda ver, se ejecuta la primera vez la transacción STWB_2 - Gestión plan de test:\r\n\r\n        Si no aparece nada, se da click en gestión de favoritos.\r\n        Toda la información siguiente siempre en blanco: Luego el signo +  , luego reloj  , ahí deben aparecer los catalogos cargados, escojemos el que nos corresponda, ejemplo:\r\n        <img src=\"img/SOLMAN8.jpg\"  loading=\"lazy\" alt=\"SOLMAN8\">\r\n        Una vez grabado y adicionado en el primer menú.\r\n        Damos doble click en   para elegir el proyecto que se carga en la parte de arriba.\r\n\r\n        A continuación damos click en icono Paquetes de test  . Ahí aparecen todos los proyectos, pero elegimos solo el de nosotros, ejemplo:\r\n        <img src=\"img/SOLMAN9.jpg\"  loading=\"lazy\" alt=\"SOLMAN9\">\r\n        Damos click en el icono asignación de responsables.   y agregamos el usuario al modulo respectivo.\r\n\r\n        Una vez hecho lo anterior, ya se puede ejecutar la transacción STWB_WORK - Usuario q.ejecuta test pool trabajo, en donde le aparecen las transacciones que debe probar el usuario, en el icono ejecutar invoca el servidor de pruebas, pero previamente alguien lo debió configurar.\r\n        Ejemplo:\r\n        <img src=\"img/SOLMAN10.jpg\"  loading=\"lazy\" alt=\"SOLMAN10\">\r\n        Una vez cargadas todas las transacciones que debe probar el usuario, y si se requiere adicionar mas se debe:\r\n\r\n        -\tAgregar la transacción por SOLAR02\r\n        -\tIngresar por STWB_2 - Gestión plan de test\r\n        1.\tDar click en   para seleccionar el proyecto y quede en la parte de arriba.\r\n        2.\tSe da lápiz para modificar\r\n        3.\tSe despliega todo el árbol, y se marca con Check la nueva transacción adicionada, y se genera.\r\n        4.\tNos devolvemos de la opción si salirnos y damos click en el icono paquetes de test  .\r\n        5.\tSe elije el respectivo modulo dando click sobre el modulo.\r\n        6.\tSe da lápiz   y se genera. Ejemplo:\r\n        <img src=\"img/SOLMAN11.jpg\"  loading=\"lazy\" alt=\"SOLMAN11\">\r\n        <img src=\"img/SOLMAN12.jpg\"  loading=\"lazy\" alt=\"SOLMAN12\">\r\n        Y ya debe aparecer dentro de los escenarios de pruebas."},{"id":"rec-72","category":"abap","title":"ERROR EN LA PLANIFICACIÓN DE TURNOS – PP61 CUANDO SE DE CLICK DERECHO SOBRE LA MALLA Y SE SA","summary":"ERROR EN LA PLANIFICACIÓN DE TURNOS – PP61 CUANDO SE DE CLICK DERECHO SOBRE LA MALLA Y SE SALGA DEL PROGRAMA: Aplicar la nota SAP: 1427652","search":"ERROR EN LA PLANIFICACIÓN DE TURNOS – PP61 CUANDO SE DE CLICK DERECHO SOBRE LA MALLA Y SE SALGA DEL PROGRAMA: Aplicar la nota SAP: 1427652","html":"ERROR EN LA PLANI ION PARA COLOCAR CAMBIO DE MEDIDA EN LA TABLE CONTROL DE LA PA40 En el FORM new_pernr","summary":"AMPLIACION PARA COLOCAR CAMBIO DE MEDIDA EN LA TABLE CONTROL DE LA PA40 En el FORM new_pernr del Include MP50AF00 \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"","search":"AMPLIACION PARA COLOCAR CAMBIO DE MEDIDA EN LA TABLE CONTROL DE LA PA40 En el FORM new_pernr del Include MP50AF00 \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(1) Forma NEW_PERNR, Inicio A *$*$-Start: (1)---------------------------------------------------------------------------------$*$* ENHANCEMENT 1 ZAHCM_PA40. \"active version * Esta ampliacion, permite que si se esta ejecutando un BI se pueda tomar el codigo de la medida * del menu de PA40 y colocarlo en la primera posicion. * Caso se trata en el programa ZRHCMPA_TERMCONTR - H.RAMIREZ29 24/OCT/2011 DATA: lc_massn_bi_tc(2) TYPE c. DATA: BEGIN OF lt_massntab. INCLUDE STRUCTURE massntab. DATA: END OF lt_massntab. IMPORT lc_massn_bi_tc TO lc_massn_bi_tc FROM MEMORY ID 'lc_massn_bi_tc '. IF lc_massn_bi_tc IS NOT INITIAL. LOOP AT massntab INTO lt_massntab WHERE massn = lc_massn_bi_tc. ENDLOOP. IF sy-subrc = '0'. LOOP AT massntab. MOVE-CORRESPONDING lt_massntab TO massntab. MODIFY massntab. EXIT. ENDLOOP. ENDIF. ENDIF. FREE MEMORY ID lc_massn_bi_tc. ENDENHANCEMENT. Desde el programa origen se envía el valor de lc_massn_bi_tc, que se encuentra en el menú de la PA40. Ejemplo: lc_massn_bi_tc = ‘ZM’. “Medida de retiro. EXPORT lc_massn_bi_tc FROM lc_massn_bi_tc TO MEMORY ID 'lc_massn_bi_tc '. NOTA: Siempre se debe inicializar esta constante en memoria, para evitar que se quede pegado con ese valor, por lo tanto al inicio del programa, y al terminar el BI se coloca: CLEAR: lc_massn_bi_tc. EXPORT lc_massn_bi_tc TO MEMORY ID 'lc_massn_bi_tc'.","html":"AMPLIACION PARA COLOCAR CAMBIO DE MEDIDA EN LA TABLE CONTROL DE LA PA40\r\n\r\n        En el FORM new_pernr del Include MP50AF00\r\n\r\n        \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"$\"$\\SE:(1) Forma NEW_PERNR, Inicio                                                                                                                           A\r\n        *$*$-Start: (1)---------------------------------------------------------------------------------$*$*\r\n        ENHANCEMENT 1  ZAHCM_PA40.    \"active version\r\n        * Esta ampliacion, permite que si se esta ejecutando un BI se pueda tomar el codigo de la medida\r\n        * del menu de PA40 y colocarlo en la primera posicion.\r\n        * Caso se trata en el programa ZRHCMPA_TERMCONTR - H.RAMIREZ29  24/OCT/2011\r\n          DATA: lc_massn_bi_tc(2)    TYPE c.\r\n\r\n          DATA: BEGIN OF lt_massntab.\r\n                  INCLUDE STRUCTURE massntab.\r\n          DATA: END OF lt_massntab.\r\n\r\n          IMPORT lc_massn_bi_tc TO lc_massn_bi_tc FROM MEMORY ID 'lc_massn_bi_tc '.\r\n\r\n          IF lc_massn_bi_tc      IS NOT INITIAL.\r\n            LOOP AT massntab     INTO lt_massntab WHERE massn = lc_massn_bi_tc.\r\n            ENDLOOP.\r\n            IF sy-subrc      = '0'.\r\n              LOOP AT massntab.\r\n                MOVE-CORRESPONDING lt_massntab TO massntab.\r\n                MODIFY massntab.\r\n                EXIT.\r\n              ENDLOOP.\r\n            ENDIF.\r\n          ENDIF.\r\n\r\n          FREE MEMORY ID lc_massn_bi_tc.\r\n\r\n        ENDENHANCEMENT.\r\n\r\n        Desde el programa origen se envía el valor de lc_massn_bi_tc, que se encuentra en el menú de la PA40.\r\n        Ejemplo:\r\n          lc_massn_bi_tc            = ‘ZM’. “Medida de retiro.\r\n\r\n        EXPORT lc_massn_bi_tc          FROM lc_massn_bi_tc TO MEMORY ID 'lc_massn_bi_tc '.\r\n        NOTA: Siempre se debe inicializar esta constante en memoria, para evitar que se quede pegado con ese valor, por lo tanto al inicio del programa, y al terminar el BI se coloca:\r\n\r\n          CLEAR: lc_massn_bi_tc.\r\n          EXPORT lc_massn_bi_tc     TO MEMORY ID 'lc_massn_bi_tc'."},{"id":"rec-79","category":"abap","title":"TABLA DONDE SE ENCUENTRA LA DESCRIPCION VERBAL 1002 HRT1002 con la vista HRV1002A se puede l","summary":"TABLA DONDE SE ENCUENTRA LA DESCRIPCION VERBAL 1002 HRT1002 con la vista HRV1002A se puede leer con la función RH_OBJECT_DESCRIPTION_READ HRP1000 se puede leer con la función RH_READ_OBJECT ","search":"TABLA DONDE SE ENCUENTRA LA DESCRIPCION VERBAL 1002 HRT1002 con la vista HRV1002A se puede leer con la función RH_OBJECT_DESCRIPTION_READ HRP1000 se puede leer con la función RH_READ_OBJECT gv_plvar TYPE plvar, CALL FUNCTION 'RH_INTEGRATION_CHECK' IMPORTING integrated_plvar = gv_plvar EXCEPTIONS OTHERS = 1. CALL FUNCTION 'RH_READ_OBJECT' EXPORTING plvar = gv_plvar otype = 'O' objid = p0001-orgeh realo = ' ' istat = ' ' begda = pn-begda endda = pn-endda langu = sy-langu ointerval = 'X' store = 'X' check_stru_auth = 'X' read_db = ' ' IMPORTING * OBEG = * OEND = * OSTAT = * HISTO = * SHORT = * STEXT = * TISTAT = * TLANGU = display_text = wa_listadomod-orgeh_text * TABLES * EXISTENCE = EXCEPTIONS not_found = 1 OTHERS = 2. IF sy-subrc 0. * Implement suitable error handling here ENDIF.","html":"TABLA DONDE SE ENCUENTRA LA DESCRIPCION VERBAL 1002\r\n\r\n        HRT1002 con la vista HRV1002A\r\n\r\n        se puede leer con la función RH_OBJECT_DESCRIPTION_READ\r\n\r\n        HRP1000 se puede leer con la función  RH_READ_OBJECT\r\n\r\n        gv_plvar      TYPE plvar,\r\n          CALL FUNCTION 'RH_INTEGRATION_CHECK'\r\n            IMPORTING\r\n              integrated_plvar = gv_plvar\r\n            EXCEPTIONS\r\n              OTHERS           = 1.\r\n\r\n          CALL FUNCTION 'RH_READ_OBJECT'\r\n            EXPORTING\r\n              plvar           = gv_plvar\r\n              otype           = 'O'\r\n              objid           = p0001-orgeh\r\n              realo           = ' '\r\n              istat           = ' '\r\n              begda           = pn-begda\r\n              endda           = pn-endda\r\n              langu           = sy-langu\r\n              ointerval       = 'X'\r\n              store           = 'X'\r\n              check_stru_auth = 'X'\r\n              read_db         = ' '\r\n            IMPORTING\r\n        *     OBEG            =\r\n        *     OEND            =\r\n        *     OSTAT           =\r\n        *     HISTO           =\r\n        *     SHORT           =\r\n        *     STEXT           =\r\n        *     TISTAT          =\r\n        *     TLANGU          =\r\n              display_text    = wa_listadomod-orgeh_text\r\n        * TABLES\r\n        *     EXISTENCE       =\r\n            EXCEPTIONS\r\n              not_found       = 1\r\n              OTHERS          = 2.\r\n          IF sy-subrc <> 0.\r\n        * Implement suitable error handling here\r\n          ENDIF."},{"id":"rec-80","category":"autorizaciones","title":"INTEGRACION DE OM CON PA Antes de ejecutar esos reportes, tener encuenta que la tabla T77S0,","summary":"INTEGRACION DE OM CON PA Antes de ejecutar esos reportes, tener encuenta que la tabla T77S0, debe quedar con los siguientes parámetros: PLOGI TEXTC Integración: Adoptar texto breve de funció","search":"INTEGRACION DE OM CON PA Antes de ejecutar esos reportes, tener encuenta que la tabla T77S0, debe quedar con los siguientes parámetros: PLOGI TEXTC Integración: Adoptar texto breve de función PLOGI TEXTD X Integración: Fecha selección p.textos OM (IT0001) PLOGI TEXTO Integración: Adoptar texto breve de unidad org. PLOGI TEXTS Integración: Adoptar texto breve de posición Igualmente no es necesario en muchas ocasiones ejecutar todos los reportes, depende de las necesidades: RHINTE00(Este es el que se debe ejecutar para la salida en vivo) , RHINTE10 etc. Ajustar las vacantes S_AHR_61016510 - Corregir vacantes","html":"INTEGRACION DE OM CON PA\r\n\r\n        Antes de ejecutar esos reportes, tener encuenta que la tabla T77S0, debe quedar con los siguientes parámetros:\r\n        PLOGI\tTEXTC\t          \tIntegración: Adoptar texto breve de función\r\n        PLOGI\tTEXTD\tX\tIntegración: Fecha selección p.textos OM (IT0001)\r\n        PLOGI\tTEXTO\t          \tIntegración: Adoptar texto breve de unidad org.\r\n        PLOGI\tTEXTS\t          \tIntegración: Adoptar texto breve de posición\r\n\r\n        Igualmente no es necesario en muchas ocasiones ejecutar todos los reportes, depende de las necesidades: RHINTE00(Este es el que se debe ejecutar para la salida en vivo) , RHINTE10 etc.\r\n\r\n        Ajustar las vacantes S_AHR_61016510 - Corregir vacantes"},{"id":"rec-81","category":"abap","title":"INTEGRACION DE ACREEDORES CON CONTABILIDAD – FI Transacción PRAA","summary":"INTEGRACION DE ACREEDORES CON CONTABILIDAD – FI Transacción PRAA","search":"INTEGRACION DE ACREEDORES CON CONTABILIDAD – FI Transacción PRAA","html":"INTEGRACION DE ACREEDORES CON CONTABILIDAD – FI\r\n\r\n        Transacción PRAA"},{"id":"rec-82","category":"abap","title":"PARA GENERAR DOCUMENTOS PDF, VISUALIZANDO DESDE SMARFORMS • Se visualiza el smartforms","summary":"PARA GENERAR DOCUMENTOS PDF, VISUALIZANDO DESDE SMARFORMS • Se visualiza el smartforms. • Estando ahí se digita pdf! Y se abre automáticamente el PDF, no funciona para todo.","search":"PARA GENERAR DOCUMENTOS PDF, VISUALIZANDO DESDE SMARFORMS • Se visualiza el smartforms. • Estando ahí se digita pdf! Y se abre automáticamente el PDF, no funciona para todo.","html":"PARA GENERAR DOCUMENTOS PDF, VISUALIZANDO DESDE SMARFORMS\r\n\r\n        •\tSe visualiza el smartforms.\r\n        •\tEstando ahí se digita pdf!\r\n\r\n        Y se abre automáticamente el PDF, no funciona para todo."},{"id":"rec-83","category":"nomina","ti
