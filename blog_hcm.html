 P_LGART = RT-LGART P_CUMUL = GN_P_CUMUL P_KEYDATE = aper-endda * P_T512W = IMPORTING P_VALUE = GN_P_VALUE P_KUM96 = GN_P_KUM96 P_RETURN_CODE = GN_P_RETURN_CODE. IF GN_P_VALUE = '1'. ADD RT-BETRG TO LC_VALUE_BONUS. ENDIF. ENDLOOP. ENDIF.","html":"CONOCER LA CLASE DE ACUMULACION DEL CONCEPTO – CCNOMINA\r\n\r\n        HR_99S_GET_CUMUL_VALUE\r\n          IF as-parm1 EQ 'ZPPR'.\r\n             DATA: GN_P_CUMUL        TYPE NUMC2 VALUE '86',\r\n                   GN_P_VALUE,\r\n                   GN_P_KUM96(96),\r\n                   GN_P_RETURN_CODE  TYPE SYSUBRC.\r\n\r\n             CLEAR: LC_VALUE_BONUS.\r\n             LOOP AT IT WHERE LGART CS 'M'.\r\n               CALL FUNCTION 'HR_99S_GET_CUMUL_VALUE'\r\n                EXPORTING\r\n                  P_MOLGA             = CALCMOLGA\r\n                  P_LGART             = IT-LGART\r\n                  P_CUMUL             = GN_P_CUMUL\r\n                  P_KEYDATE           = aper-endda\r\n        *          P_T512W             =\r\n                IMPORTING\r\n                  P_VALUE             = GN_P_VALUE\r\n                  P_KUM96             = GN_P_KUM96\r\n                  P_RETURN_CODE       = GN_P_RETURN_CODE.\r\n\r\n                IF GN_P_VALUE            = '1'.\r\n                   ADD IT-BETRG          TO LC_VALUE_BONUS.\r\n                ENDIF.\r\n             ENDLOOP.\r\n             LOOP AT RT WHERE LGART CS 'M'.\r\n               CALL FUNCTION 'HR_99S_GET_CUMUL_VALUE'\r\n                EXPORTING\r\n                  P_MOLGA             = CALCMOLGA\r\n                  P_LGART             = RT-LGART\r\n                  P_CUMUL             = GN_P_CUMUL\r\n                  P_KEYDATE           = aper-endda\r\n        *          P_T512W             =\r\n                IMPORTING\r\n                  P_VALUE             = GN_P_VALUE\r\n                  P_KUM96             = GN_P_KUM96\r\n                  P_RETURN_CODE       = GN_P_RETURN_CODE.\r\n\r\n                IF GN_P_VALUE            = '1'.\r\n                   ADD RT-BETRG          TO LC_VALUE_BONUS.\r\n                ENDIF.\r\n             ENDLOOP.\r\n          ENDIF."},{"id":"rec-85","category":"nomina","title":"CONOCER LA CLASE DE TRATAMIENTO DEL CONCEPTO – CCNOMINA CONSTANTS","summary":"CONOCER LA CLASE DE TRATAMIENTO DEL CONCEPTO – CCNOMINA CONSTANTS: cc_clase_90 TYPE aklax VALUE '90'. DATA: gc_v_clase_90 TYPE auspv, gc_subrc TYPE sysubrc. CALL FUNCTION 'HR_99S_GET_PROC_CL","search":"CONOCER LA CLASE DE TRATAMIENTO DEL CONCEPTO – CCNOMINA CONSTANTS: cc_clase_90 TYPE aklax VALUE '90'. DATA: gc_v_clase_90 TYPE auspv, gc_subrc TYPE sysubrc. CALL FUNCTION 'HR_99S_GET_PROC_CLASS_VALUE' EXPORTING p_molga = calcmolga p_lgart = p_ls_p0014-lgart p_proc_class = cc_clase_90 p_keydate = p_gd_endda * P_T512W = IMPORTING p_value = gc_v_clase_90 p_return_code = gc_subrc.","html":"CONOCER LA CLASE DE TRATAMIENTO DEL CONCEPTO – CCNOMINA\r\n\r\n        CONSTANTS: cc_clase_90          TYPE aklax VALUE '90'.\r\n\r\n        DATA: gc_v_clase_90             TYPE auspv,\r\n              gc_subrc                  TYPE sysubrc.\r\n\r\n        CALL FUNCTION 'HR_99S_GET_PROC_CLASS_VALUE'\r\n          EXPORTING\r\n            p_molga       = calcmolga\r\n            p_lgart       = p_ls_p0014-lgart\r\n            p_proc_class  = cc_clase_90\r\n            p_keydate     = p_gd_endda\r\n      *     P_T512W       =\r\n          IMPORTING\r\n            p_value       = gc_v_clase_90\r\n            p_return_code = gc_subrc."},{"id":"rec-86","category":"nomina","title":"CONOCER LA CLASE DE EVALUACION DEL CONCEPTO – CCNOMINA - T512W TYPES","summary":"CONOCER LA CLASE DE EVALUACION DEL CONCEPTO – CCNOMINA - T512W TYPES: BEGIN OF type_lgart, lgart TYPE lgart, lgtxt TYPE lgtxt, END OF type_lgart. gv_value TYPE char02, gv_molga TYPE molga, t","search":"CONOCER LA CLASE DE EVALUACION DEL CONCEPTO – CCNOMINA - T512W TYPES: BEGIN OF type_lgart, lgart TYPE lgart, lgtxt TYPE lgtxt, END OF type_lgart. gv_value TYPE char02, gv_molga TYPE molga, ti_lgart TYPE STANDARD TABLE OF type_lgart, wa_lgart TYPE type_lgart, gv_sysubrc type sysubrc CLEAR: gv_molga. SELECT SINGLE molga INTO gv_molga FROM t001p WHERE werks = p0001-werks AND btrtl = p0001-btrtl. IF ti_lgart[] IS INITIAL. SELECT t1~lgart t2~lgtxt INTO TABLE ti_lgart FROM t512w AS t1 LEFT OUTER JOIN t512t AS t2 ON t1~molga = t2~molga AND t1~lgart = t2~lgart AND t2~sprsl = sy-langu WHERE t1~molga = gv_molga AND t1~endda GE sy-datum AND t1~begda LE sy-datum. LOOP AT ti_lgart INTO wa_lgart. CLEAR: gv_value. CALL FUNCTION 'ZMFPAHR_99S_GET_EVAL_VALUE' EXPORTING p_molga = gv_molga p_lgart = wa_lgart-lgart p_proc_class = '02' \"Asignación CC-nóminas para impresión formulario p_keydate = sy-datum * P_T512W = IMPORTING p_value = gv_value p_return_code = gv_sysubrc. * IF gv_value 'F4'. \"Deducciones * DELETE ti_lgart. * ENDIF. ENDLOOP.","html":"CONOCER LA CLASE DE EVALUACION DEL CONCEPTO – CCNOMINA - T512W\r\n\r\n          TYPES: BEGIN OF type_lgart,\r\n                  lgart TYPE lgart,\r\n                  lgtxt TYPE lgtxt,\r\n                END OF type_lgart.\r\n\r\n          gv_value              TYPE char02,\r\n          gv_molga              TYPE molga,\r\n          ti_lgart              TYPE STANDARD TABLE OF type_lgart,\r\n          wa_lgart              TYPE type_lgart,\r\n          gv_sysubrc            type sysubrc\r\n\r\n\r\n            CLEAR: gv_molga.\r\n            SELECT SINGLE molga INTO gv_molga FROM t001p WHERE werks = p0001-werks AND\r\n                                                              btrtl = p0001-btrtl.\r\n\r\n            IF ti_lgart[]              IS INITIAL.\r\n              SELECT t1~lgart t2~lgtxt INTO TABLE ti_lgart\r\n              FROM t512w AS t1 LEFT OUTER JOIN t512t AS t2\r\n                ON  t1~molga = t2~molga\r\n                AND t1~lgart = t2~lgart\r\n                AND t2~sprsl = sy-langu\r\n                  WHERE  t1~molga  = gv_molga\r\n                  AND    t1~endda  GE sy-datum\r\n                  AND    t1~begda  LE sy-datum.\r\n\r\n              LOOP AT ti_lgart INTO wa_lgart.\r\n                CLEAR: gv_value.\r\n                CALL FUNCTION 'ZMFPAHR_99S_GET_EVAL_VALUE'\r\n                  EXPORTING\r\n                    p_molga       = gv_molga\r\n                    p_lgart       = wa_lgart-lgart\r\n                    p_proc_class  = '02' \"Asignación CC-nóminas para impresión formulario\r\n                    p_keydate     = sy-datum\r\n          *         P_T512W       =\r\n                  IMPORTING\r\n                    p_value       = gv_value\r\n                    p_return_code = gv_sysubrc.\r\n\r\n          *      IF gv_value       <> 'F4'. \"Deducciones\r\n          *        DELETE ti_lgart.\r\n          *      ENDIF.\r\n              ENDLOOP."},{"id":"rec-87","category":"abap","title":"VALIDACIÓN DOBLE DUPLICADO CEDULA EN ZXPADU02 SOBRE IT P0002 WHEN '0002'","summary":"VALIDACIÓN DOBLE DUPLICADO CEDULA EN ZXPADU02 SOBRE IT P0002 WHEN '0002'. CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn EXPORTING prelp = innnn IMPORTING pnnnn = wa_p0002. **** SE LE PEG","search":"VALIDACIÓN DOBLE DUPLICADO CEDULA EN ZXPADU02 SOBRE IT P0002 WHEN '0002'. CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn EXPORTING prelp = innnn IMPORTING pnnnn = wa_p0002. **** SE LE PEGA A LA BD DIRECTAMENTE YA QUE POR PERFILES PUEDE NO TRAER LA INFORMACION 08.04.2014 HRP IF ipsyst-ioper = 'INS' OR ipsyst-ioper = 'INSS' OR ipsyst-ioper = 'COP'. CLEAR: wa_pa0002. SELECT SINGLE * INTO wa_pa0002 FROM pa0002 WHERE pernr NE wa_p0002-pernr AND perid = wa_p0002-perid AND begda ipsyst-begda. IF sy-subrc = 0. CLEAR: wa_pa0000. SELECT SINGLE * INTO wa_pa0000 FROM pa0000 WHERE pernr = wa_pa0002-pernr AND stat2 NE 0 AND begda ipsyst-begda. IF sy-subrc = 0. MESSAGE e003(zhcm_cargues) WITH wa_pa0000-pernr. * Esta persona ya se encuentra activa en el sistema, con codigo &. ELSE. CLEAR: wa_pa0000. SELECT SINGLE * INTO wa_pa0000 FROM pa0000 WHERE pernr = wa_pa0002-pernr AND begda ipsyst-begda AND stat2 = 0 AND massn = 'C1' AND massg = 12. IF sy-subrc = 0. MESSAGE e002(zhcm_cargues). * Esta persona ya laboró en CONALVIAS y su motivo de retiro fue especial. ENDIF. ENDIF. ENDIF. ENDIF.","html":"VALIDACIÓN DOBLE DUPLICADO CEDULA EN ZXPADU02 SOBRE IT P0002\r\n          WHEN '0002'.\r\n\r\n            CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn\r\n              EXPORTING\r\n                prelp = innnn\r\n              IMPORTING\r\n                pnnnn = wa_p0002.\r\n\r\n        **** SE LE PEGA A LA BD DIRECTAMENTE YA QUE POR PERFILES PUEDE NO TRAER LA INFORMACION 08.04.2014  HRP\r\n            IF ipsyst-ioper = 'INS'  OR\r\n              ipsyst-ioper = 'INSS' OR\r\n              ipsyst-ioper = 'COP'.\r\n              CLEAR: wa_pa0002.\r\n              SELECT SINGLE * INTO wa_pa0002 FROM pa0002 WHERE pernr NE wa_p0002-pernr AND\r\n                                                              perid =  wa_p0002-perid AND\r\n                                                              begda <= ipsyst-endda AND\r\n                                                              endda => ipsyst-begda.\r\n              IF sy-subrc     = 0.\r\n                CLEAR: wa_pa0000.\r\n                SELECT SINGLE * INTO wa_pa0000 FROM pa0000 WHERE pernr = wa_pa0002-pernr AND\r\n                                                                stat2 NE 0 AND\r\n                                                                begda <= ipsyst-endda AND\r\n                                                                endda => ipsyst-begda.\r\n                IF sy-subrc     = 0.\r\n                  MESSAGE e003(zhcm_cargues) WITH wa_pa0000-pernr.\r\n        *          Esta persona ya se encuentra activa en el sistema, con codigo &.\r\n                ELSE.\r\n                  CLEAR: wa_pa0000.\r\n                  SELECT SINGLE * INTO wa_pa0000 FROM pa0000 WHERE pernr = wa_pa0002-pernr AND\r\n                                                                  begda <= ipsyst-endda AND\r\n                                                                  endda => ipsyst-begda AND\r\n                                                                  stat2 = 0 AND\r\n                                                                  massn = 'C1' AND\r\n                                                                  massg = 12.\r\n                  IF sy-subrc     = 0.\r\n                    MESSAGE e002(zhcm_cargues).\r\n        *   Esta persona ya laboró en CONALVIAS y su motivo de retiro fue especial.\r\n                  ENDIF.\r\n                ENDIF.\r\n              ENDIF.\r\n            ENDIF."},{"id":"rec-88","category":"abap","title":"CREAR UNA RFC DE OTRO SISTEMA A SAP TRAVES DE PI Se crea un modulo de funcion por la SE37 no","summary":"CREAR UNA RFC DE OTRO SISTEMA A SAP TRAVES DE PI Se crea un modulo de funcion por la SE37 normal. El modulo debe ser llamado desde uno de los procesos de PI, con la misma estructura de este ","search":"CREAR UNA RFC DE OTRO SISTEMA A SAP TRAVES DE PI Se crea un modulo de funcion por la SE37 normal. El modulo debe ser llamado desde uno de los procesos de PI, con la misma estructura de este modulo de funciones. Para el ejemplo: PI envía una información que es grabada en el IT0015 a traves de un BI, y luego se devuelve un mensaje para indicar si se grabo correctamente o tuvo un error al grabar. ZFMHCM_IT0015 en atributos: Modulo de acceso remoto FUNCTION zfmhcm_it0015. *\"---------------------------------------------------------------------- *\"*\"Interfase local *\" TABLES *\" GTI_TABLE TYPE ZTTHCM_IT0015 *\"---------------------------------------------------------------------- LOOP AT gti_table INTO gst_table_p0015. CONCATENATE gst_table_p0015-begda(4) gst_table_p0015-begda+5(2) gst_table_p0015-begda+8(2) INTO gd_begda. CONCATENATE gst_table_p0015-begda+8(2) gst_table_p0015-begda+5(2) gst_table_p0015-begda(4) INTO gd_begda_dyn. CLEAR: it_p0001, it_p0001[]. CALL FUNCTION 'HR_READ_INFOTYPE' EXPORTING tclas = 'A' pernr = gst_table_p0015-pernr infty = '0001' begda = gd_begda endda = gd_begda TABLES infty_tab = it_p0001 EXCEPTIONS infty_not_found = 1 OTHERS = 2. READ TABLE it_p0001 INTO st_p0001 INDEX 1. IF sy-subrc NE 0. gst_table_p0015-message = 'Empleado no activo para la fecha'. ELSE. CLEAR: gt_bdcdata[]. PERFORM bdc_dynpro USING 'SAPMP50A' '1000'. PERFORM bdc_field USING 'BDC_OKCODE' '=INS'. WRITE gst_table_p0015-pernr TO gc_pernr_bi. PERFORM bdc_field USING 'RP50G-PERNR' gc_pernr_bi. PERFORM bdc_field USING 'BDC_SUBSCR' '/1PAPAXX/HDR_11001A 0100SUBSCR_HEADER'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0400SUBSCR_MENU'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0310SUBSCR_ITMENU'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0330SUBSCR_TIME'. PERFORM bdc_field USING 'RP50G-TIMR6' 'X'. PERFORM bdc_field USING 'RP50G-BEGDA' gd_begda_dyn. PERFORM bdc_field USING 'RP50G-ENDDA' gd_begda_dyn. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0350SUBSCR_ITKEYS'. PERFORM bdc_field USING 'BDC_CURSOR' 'RP50G-SUBTY'. PERFORM bdc_field USING 'RP50G-CHOIC' '0015'. PERFORM bdc_field USING 'RP50G-SUBTY' gst_table_p0015-subty. PERFORM bdc_dynpro USING 'MP001500' '2000'. PERFORM bdc_field USING 'BDC_CURSOR' 'Q0015-BETRG'. IF gst_table_p0015-gsber IS INITIAL. PERFORM bdc_field USING 'BDC_OKCODE' '=UPD'. WRITE gst_table_p0015-betrg TO gc_betrg. REPLACE ALL OCCURRENCES OF: ',00' IN gc_betrg WITH ''. REPLACE ALL OCCURRENCES OF: '.' IN gc_betrg WITH ''. PERFORM bdc_field USING 'Q0015-BETRG' gc_betrg. PERFORM bdc_field USING 'BDC_SUBSCR' 'MP001500 0100SUB0015'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0090SUBSCREEN_T582C'. ELSE. PERFORM bdc_field USING 'BDC_OKCODE' '=PRIM'. WRITE gst_table_p0015-betrg TO gc_betrg. REPLACE ALL OCCURRENCES OF: ',00' IN gc_betrg WITH ''. REPLACE ALL OCCURRENCES OF: '.' IN gc_betrg WITH ''. PERFORM bdc_field USING 'Q0015-BETRG' gc_betrg. PERFORM bdc_field USING 'BDC_SUBSCR' 'MP001500 0100SUB0015'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0090SUBSCREEN_T582C'. PERFORM bdc_dynpro USING 'SAPLHRTV' '0300'. PERFORM bdc_field USING 'BDC_CURSOR' 'COBL-KOSTL'. PERFORM bdc_field USING 'BDC_OKCODE' '=GOON'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPLKACB 1007BLOCK'. PERFORM bdc_field USING 'COBL-GSBER' gst_table_p0015-gsber. PERFORM bdc_field USING 'COBL-KOSTL' gst_table_p0015-kostl. PERFORM bdc_dynpro USING 'MP001500' '2000'. PERFORM bdc_field USING 'BDC_OKCODE' '=UPD'. PERFORM bdc_field USING 'BDC_SUBSCR' 'MP001500 0100SUB0015'. PERFORM bdc_field USING 'BDC_SUBSCR' 'SAPMP50A 0090SUBSCREEN_T582C'. ENDIF. CLEAR gt_itab[]. gs_ctu_params-dismode = 'E'. CALL TRANSACTION 'PA30' USING gt_bdcdata OPTIONS FROM gs_ctu_params MESSAGES INTO gt_itab. LOOP AT gt_itab INTO gs_sitab WHERE msgtyp = 'E'. CALL FUNCTION 'MESSAGE_TEXT_BUILD' EXPORTING msgid = gs_sitab-msgid msgnr = gs_sitab-msgnr msgv1 = gs_sitab-msgv1 msgv2 = gs_sitab-msgv2 msgv3 = gs_sitab-msgv3 msgv4 = gs_sitab-msgv4 IMPORTING message_text_output = gs_sitab-msgv1. gst_table_p0015-message = gs_sitab-msgv1. ENDLOOP. IF sy-subrc NE 0. COMMIT WORK AND WAIT. CLEAR: it_p0015, it_p0015[]. CALL FUNCTION 'HR_READ_INFOTYPE' EXPORTING tclas = 'A' pernr = gst_table_p0015-pernr infty = '0015' begda = gd_begda endda = gd_begda TABLES infty_tab = it_p0015 EXCEPTIONS infty_not_found = 1 OTHERS = 2. READ TABLE it_p0015 INTO st_p0015 WITH KEY subty = gst_table_p0015-subty begda = gd_begda endda = gd_begda. IF sy-subrc = 0. gst_table_p0015-message = 'Registro Grabado Correctamente'. ELSE. gst_table_p0015-message = 'Registro no pudo ser Grabado'. ENDIF. ENDIF. ENDIF. MODIFY gti_table FROM gst_table_p0015. ENDLOOP. ENDFUNCTION.","html":"CREAR UNA RFC DE OTRO SISTEMA A SAP TRAVES DE PI\r\n\r\n        Se crea un modulo de funcion por la SE37 normal.\r\n\r\n        El modulo debe ser llamado desde uno de los procesos de PI, con la misma estructura de este modulo de funciones.\r\n\r\n        Para el ejemplo: PI envía una información que es grabada en el IT0015 a traves de un BI, y luego se devuelve un mensaje para indicar si se grabo correctamente o tuvo un error al grabar.\r\n\r\n        ZFMHCM_IT0015\r\n        en atributos: Modulo de acceso remoto\r\n        <img src=\"img/se372.jpg\"  loading=\"lazy\" alt=\"se372\">\r\n        <img src=\"img/se373.jpg\"  loading=\"lazy\" alt=\"se373\">\r\n        <img src=\"img/se374.jpg\"  loading=\"lazy\" alt=\"se374\">\r\n        <img src=\"img/se375.jpg\"  loading=\"lazy\" alt=\"se375\">\r\n        <img src=\"img/se376.jpg\"  loading=\"lazy\" alt=\"se376\">\r\n        <img src=\"img/se377.jpg\"  loading=\"lazy\" alt=\"se377\">\r\n        FUNCTION zfmhcm_it0015.\r\n        *\"----------------------------------------------------------------------\r\n        *\"*\"Interfase local\r\n        *\"  TABLES\r\n        *\"      GTI_TABLE TYPE  ZTTHCM_IT0015\r\n        *\"----------------------------------------------------------------------\r\n\r\n          LOOP AT gti_table INTO gst_table_p0015.\r\n            CONCATENATE gst_table_p0015-begda(4) gst_table_p0015-begda+5(2) gst_table_p0015-begda+8(2)\r\n                                    INTO gd_begda.\r\n            CONCATENATE gst_table_p0015-begda+8(2) gst_table_p0015-begda+5(2) gst_table_p0015-begda(4)\r\n                                    INTO gd_begda_dyn.\r\n            CLEAR: it_p0001, it_p0001[].\r\n            CALL FUNCTION 'HR_READ_INFOTYPE'\r\n              EXPORTING\r\n                tclas           = 'A'\r\n                pernr           = gst_table_p0015-pernr\r\n                infty           = '0001'\r\n                begda           = gd_begda\r\n                endda           = gd_begda\r\n              TABLES\r\n                infty_tab       = it_p0001\r\n              EXCEPTIONS\r\n                infty_not_found = 1\r\n                OTHERS          = 2.\r\n\r\n            READ TABLE it_p0001       INTO st_p0001 INDEX 1.\r\n            IF sy-subrc               NE 0.\r\n              gst_table_p0015-message = 'Empleado no activo para la fecha'.\r\n            ELSE.\r\n\r\n              CLEAR: gt_bdcdata[].\r\n              PERFORM bdc_dynpro      USING 'SAPMP50A'      '1000'.\r\n              PERFORM bdc_field       USING 'BDC_OKCODE'    '=INS'.\r\n              WRITE   gst_table_p0015-pernr TO gc_pernr_bi.\r\n              PERFORM bdc_field       USING 'RP50G-PERNR'   gc_pernr_bi.\r\n              PERFORM bdc_field       USING 'BDC_SUBSCR'   '/1PAPAXX/HDR_11001A                     0100SUBSCR_HEADER'.\r\n              PERFORM bdc_field       USING 'BDC_SUBSCR'   'SAPMP50A                                0400SUBSCR_MENU'.\r\n              PERFORM bdc_field       USING 'BDC_SUBSCR'   'SAPMP50A                                0310SUBSCR_ITMENU'.\r\n              PERFORM bdc_field       USING 'BDC_SUBSCR'   'SAPMP50A                                0330SUBSCR_TIME'.\r\n              PERFORM bdc_field       USING 'RP50G-TIMR6'   'X'.\r\n\r\n              PERFORM bdc_field       USING 'RP50G-BEGDA'   gd_begda_dyn.\r\n              PERFORM bdc_field       USING 'RP50G-ENDDA'   gd_begda_dyn.\r\n\r\n              PERFORM bdc_field       USING 'BDC_SUBSCR'   'SAPMP50A                                0350SUBSCR_ITKEYS'.\r\n              PERFORM bdc_field       USING 'BDC_CURSOR'    'RP50G-SUBTY'.\r\n              PERFORM bdc_field       USING 'RP50G-CHOIC'    '0015'.\r\n              PERFORM bdc_field       USING 'RP50G-SUBTY'    gst_table_p0015-subty.\r\n\r\n              PERFORM bdc_dynpro      USING 'MP001500'      '2000'.\r\n              PERFORM bdc_field       USING 'BDC_CURSOR'    'Q0015-BETRG'.\r\n\r\n              IF gst_table_p0015-gsber  IS INITIAL.\r\n                PERFORM bdc_field       USING 'BDC_OKCODE'    '=UPD'.\r\n                WRITE gst_table_p0015-betrg   TO gc_betrg.\r\n                REPLACE ALL OCCURRENCES OF: ',00' IN gc_betrg WITH ''.\r\n                REPLACE ALL OCCURRENCES OF: '.'   IN gc_betrg WITH ''.\r\n                PERFORM bdc_field       USING 'Q0015-BETRG'    gc_betrg.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'MP001500                                0100SUB0015'.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'SAPMP50A                                0090SUBSCREEN_T582C'.\r\n              ELSE.\r\n                PERFORM bdc_field       USING 'BDC_OKCODE'    '=PRIM'.\r\n                WRITE gst_table_p0015-betrg   TO gc_betrg.\r\n                REPLACE ALL OCCURRENCES OF: ',00' IN gc_betrg WITH ''.\r\n                REPLACE ALL OCCURRENCES OF: '.'   IN gc_betrg WITH ''.\r\n                PERFORM bdc_field       USING 'Q0015-BETRG'    gc_betrg.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'MP001500                                0100SUB0015'.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'SAPMP50A                                0090SUBSCREEN_T582C'.\r\n\r\n                PERFORM bdc_dynpro      USING 'SAPLHRTV'      '0300'.\r\n                PERFORM bdc_field       USING 'BDC_CURSOR'    'COBL-KOSTL'.\r\n                PERFORM bdc_field       USING 'BDC_OKCODE'    '=GOON'.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'   'SAPLKACB                                1007BLOCK'.\r\n\r\n                PERFORM bdc_field       USING 'COBL-GSBER'    gst_table_p0015-gsber.\r\n                PERFORM bdc_field       USING 'COBL-KOSTL'    gst_table_p0015-kostl.\r\n\r\n                PERFORM bdc_dynpro      USING 'MP001500'      '2000'.\r\n                PERFORM bdc_field       USING 'BDC_OKCODE'    '=UPD'.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'MP001500                                0100SUB0015'.\r\n                PERFORM bdc_field       USING 'BDC_SUBSCR'    'SAPMP50A                                0090SUBSCREEN_T582C'.\r\n              ENDIF.\r\n\r\n              CLEAR gt_itab[].\r\n              gs_ctu_params-dismode   = 'E'.\r\n              CALL TRANSACTION 'PA30' USING gt_bdcdata\r\n                                      OPTIONS FROM gs_ctu_params\r\n                                      MESSAGES INTO gt_itab.\r\n\r\n              LOOP AT gt_itab INTO gs_sitab WHERE msgtyp   = 'E'.\r\n                CALL FUNCTION 'MESSAGE_TEXT_BUILD'\r\n                  EXPORTING\r\n                    msgid               = gs_sitab-msgid\r\n                    msgnr               = gs_sitab-msgnr\r\n                    msgv1               = gs_sitab-msgv1\r\n                    msgv2               = gs_sitab-msgv2\r\n                    msgv3               = gs_sitab-msgv3\r\n                    msgv4               = gs_sitab-msgv4\r\n                  IMPORTING\r\n                    message_text_output = gs_sitab-msgv1.\r\n                gst_table_p0015-message = gs_sitab-msgv1.\r\n              ENDLOOP.\r\n              IF sy-subrc           NE 0.\r\n                COMMIT WORK AND WAIT.\r\n                CLEAR: it_p0015, it_p0015[].\r\n                CALL FUNCTION 'HR_READ_INFOTYPE'\r\n                  EXPORTING\r\n                    tclas           = 'A'\r\n                    pernr           = gst_table_p0015-pernr\r\n                    infty           = '0015'\r\n                    begda           = gd_begda\r\n                    endda           = gd_begda\r\n                  TABLES\r\n                    infty_tab       = it_p0015\r\n                  EXCEPTIONS\r\n                    infty_not_found = 1\r\n                    OTHERS          = 2.\r\n\r\n                READ TABLE it_p0015       INTO st_p0015 WITH KEY subty = gst_table_p0015-subty\r\n                                                                 begda = gd_begda\r\n                                                                 endda = gd_begda.\r\n                IF sy-subrc               = 0.\r\n                  gst_table_p0015-message = 'Registro Grabado Correctamente'.\r\n                ELSE.\r\n                  gst_table_p0015-message = 'Registro no pudo ser Grabado'.\r\n                ENDIF.\r\n              ENDIF.\r\n            ENDIF.\r\n            MODIFY gti_table         FROM gst_table_p0015.\r\n          ENDLOOP.\r\n\r\n        ENDFUNCTION."},{"id":"rec-89","category":"abap","title":"CREAR UNA RFC DE SAP A OTRO SISTEMA A TRAVES DE PI Se crea un modulo de funciones comun y co","summary":"CREAR UNA RFC DE SAP A OTRO SISTEMA A TRAVES DE PI Se crea un modulo de funciones comun y corriente. Para el ejemplo se invoca el modulo de funciones en la ampliación de la BADI HRPAD00INFTY","search":"CREAR UNA RFC DE SAP A OTRO SISTEMA A TRAVES DE PI Se crea un modulo de funciones comun y corriente. Para el ejemplo se invoca el modulo de funciones en la ampliación de la BADI HRPAD00INFTY en IN_UPDATE. El modulo de funciones debe ser de tipo de acceso remoto. A continuacion el ejemplo para it2001: El valor de la constante gv_dest_p2001: 'ZPIDEST_AUSE', debe coincidir con el proceso que es llamado desde la SM59 en la carpeta Conexiones TCP/IP METHOD if_ex_hrpad00infty~in_update. DATA: gst_new_image TYPE prelp, gv_dest_p2001 TYPE string VALUE 'ZPIDEST_AUSE', gv_dest_p2003 TYPE string VALUE 'ZPIDEST_SUPLE', gt_data_p2001 TYPE TABLE OF zsthcm_p2001, gt_data_p2003 TYPE TABLE OF zsthcm_p2003, gst_p2001 TYPE p2001, gst_p2003 TYPE p2003, gc_action TYPE char01, st_p2001 TYPE zsthcm_p2001, st_p2003 TYPE zsthcm_p2003, it_p0001 TYPE STANDARD TABLE OF p0001, st_p0001 TYPE p0001. CASE ipspar-infty. WHEN '2001'. CLEAR: gst_p2001, gc_action. LOOP AT new_image INTO gst_new_image WHERE infty = '2001' AND opera = 'I'. gc_action = 'I'. ENDLOOP. LOOP AT new_image INTO gst_new_image WHERE infty = '2001' AND opera = 'U'. gc_action = 'D'. ENDLOOP. IF gc_action IS NOT INITIAL. * Interfaz Oracle CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn EXPORTING prelp = gst_new_image IMPORTING pnnnn = gst_p2001. CLEAR: gt_data_p2001, gt_data_p2001[]. CLEAR: st_p2001. st_p2001-action = gc_action. st_p2001-pernr = gst_p2001-pernr. st_p2001-begda = gst_p2001-begda. st_p2001-endda = gst_p2001-endda. st_p2001-awart = gst_p2001-awart. CLEAR: it_p0001, it_p0001[]. CALL FUNCTION 'HR_READ_INFOTYPE' EXPORTING tclas = 'A' pernr = gst_p2001-pernr infty = '0001' begda = gst_p2001-begda endda = gst_p2001-begda TABLES infty_tab = it_p0001 EXCEPTIONS infty_not_found = 1 OTHERS = 2. READ TABLE it_p0001 INTO st_p0001 INDEX 1. st_p2001-bukrs = st_p0001-bukrs. CALL FUNCTION 'ZFMHCM_P2001' IN BACKGROUND TASK DESTINATION gv_dest_p2001 EXPORTING st_p2001 = st_p2001 TABLES it_p2001 = gt_data_p2001. CLEAR: st_p2001, gt_data_p2001[]. ENDIF. WHEN '2003'. CLEAR: gst_p2003, gc_action. LOOP AT new_image INTO gst_new_image WHERE infty = '2003' AND opera = 'I'. gc_action = 'I'. ENDLOOP. LOOP AT new_image INTO gst_new_image WHERE infty = '2003' AND opera = 'U'. gc_action = 'D'. ENDLOOP. IF gc_action IS NOT INITIAL. * Interfaz Oracle CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn EXPORTING prelp = gst_new_image IMPORTING pnnnn = gst_p2003. CLEAR: gt_data_p2003, gt_data_p2003[]. CLEAR: st_p2003. st_p2003-action = gc_action. st_p2003-pernr = gst_p2003-pernr. st_p2003-begda = gst_p2003-begda. st_p2003-endda = gst_p2003-endda. st_p2003-plans = gst_p2003-plans. CLEAR: it_p0001, it_p0001[]. CALL FUNCTION 'HR_READ_INFOTYPE' EXPORTING tclas = 'A' pernr = gst_p2003-pernr infty = '0001' begda = gst_p2003-begda endda = gst_p2003-begda TABLES infty_tab = it_p0001 EXCEPTIONS infty_not_found = 1 OTHERS = 2. READ TABLE it_p0001 INTO st_p0001 INDEX 1. st_p2003-bukrs = st_p0001-bukrs. CALL FUNCTION 'ZFMHCM_P2003' IN BACKGROUND TASK DESTINATION gv_dest_p2003 EXPORTING st_p2003 = st_p2003 TABLES it_p2003 = gt_data_p2003. CLEAR: st_p2003, gt_data_p2003[]. ENDIF. ENDCASE. ENDMETHOD. ZFMHCM_P2001 FUNCTION ZFMHCM_P2001. *\"---------------------------------------------------------------------- *\"*\"Interfase local *\" IMPORTING *\" VALUE(ST_P2001) TYPE ZSTHCM_P2001 OPTIONAL *\" TABLES *\" IT_P2001 STRUCTURE ZSTHCM_P2001 *\" EXCEPTIONS *\" CLASSIC_EXCEPTION *\"---------------------------------------------------------------------- APPEND st_p2001 TO it_p2001. ENDFUNCTION.","html":"CREAR UNA RFC DE SAP A OTRO SISTEMA A TRAVES DE PI\r\n        Se crea un modulo de funciones comun y corriente.\r\n        Para el ejemplo se invoca el modulo de funciones en la ampliación de la BADI HRPAD00INFTY en IN_UPDATE.\r\n\r\n        El modulo de funciones debe ser de tipo de acceso remoto.\r\n        A continuacion el ejemplo para it2001:\r\n        El valor de la constante gv_dest_p2001: 'ZPIDEST_AUSE', debe coincidir con el proceso que es llamado desde la SM59 en la carpeta Conexiones TCP/IP\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n        METHOD if_ex_hrpad00infty~in_update.\r\n            DATA: gst_new_image   TYPE prelp,\r\n                  gv_dest_p2001   TYPE string VALUE 'ZPIDEST_AUSE',\r\n                  gv_dest_p2003   TYPE string VALUE 'ZPIDEST_SUPLE',\r\n                  gt_data_p2001   TYPE TABLE OF zsthcm_p2001,\r\n                  gt_data_p2003   TYPE TABLE OF zsthcm_p2003,\r\n                  gst_p2001       TYPE p2001,\r\n                  gst_p2003       TYPE p2003,\r\n                  gc_action       TYPE char01,\r\n                  st_p2001        TYPE zsthcm_p2001,\r\n                  st_p2003        TYPE zsthcm_p2003,\r\n                  it_p0001        TYPE STANDARD TABLE OF p0001,\r\n                  st_p0001        TYPE p0001.\r\n\r\n            CASE ipspar-infty.\r\n              WHEN '2001'.\r\n                CLEAR: gst_p2001, gc_action.\r\n                LOOP AT new_image INTO gst_new_image WHERE infty = '2001' AND\r\n                                                           opera = 'I'.\r\n                  gc_action        = 'I'.\r\n                ENDLOOP.\r\n                LOOP AT new_image INTO gst_new_image WHERE infty = '2001' AND\r\n                                                           opera = 'U'.\r\n                  gc_action        = 'D'.\r\n                ENDLOOP.\r\n                IF gc_action      IS NOT INITIAL.\r\n        *    Interfaz Oracle\r\n\r\n                  CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn\r\n                    EXPORTING\r\n                      prelp = gst_new_image\r\n                    IMPORTING\r\n                      pnnnn = gst_p2001.\r\n\r\n                  CLEAR: gt_data_p2001, gt_data_p2001[].\r\n                  CLEAR: st_p2001.\r\n                  st_p2001-action = gc_action.\r\n                  st_p2001-pernr  = gst_p2001-pernr.\r\n                  st_p2001-begda  = gst_p2001-begda.\r\n                  st_p2001-endda  = gst_p2001-endda.\r\n                  st_p2001-awart  = gst_p2001-awart.\r\n\r\n                  CLEAR: it_p0001, it_p0001[].\r\n                  CALL FUNCTION 'HR_READ_INFOTYPE'\r\n                    EXPORTING\r\n                      tclas           = 'A'\r\n                      pernr           = gst_p2001-pernr\r\n                      infty           = '0001'\r\n                      begda           = gst_p2001-begda\r\n                      endda           = gst_p2001-begda\r\n                    TABLES\r\n                      infty_tab       = it_p0001\r\n                    EXCEPTIONS\r\n                      infty_not_found = 1\r\n                      OTHERS          = 2.\r\n\r\n                  READ TABLE it_p0001    INTO st_p0001 INDEX 1.\r\n                  st_p2001-bukrs   = st_p0001-bukrs.\r\n\r\n                  CALL FUNCTION 'ZFMHCM_P2001' IN BACKGROUND TASK\r\n                    DESTINATION gv_dest_p2001\r\n                    EXPORTING\r\n                      st_p2001 = st_p2001\r\n                    TABLES\r\n                      it_p2001 = gt_data_p2001.\r\n\r\n                  CLEAR: st_p2001, gt_data_p2001[].\r\n                ENDIF.\r\n              WHEN '2003'.\r\n                CLEAR: gst_p2003, gc_action.\r\n                LOOP AT new_image INTO gst_new_image WHERE infty = '2003' AND\r\n                                                           opera = 'I'.\r\n                  gc_action        = 'I'.\r\n                ENDLOOP.\r\n                LOOP AT new_image INTO gst_new_image WHERE infty = '2003' AND\r\n                                                           opera = 'U'.\r\n                  gc_action        = 'D'.\r\n                ENDLOOP.\r\n                IF gc_action      IS NOT INITIAL.\r\n        *    Interfaz Oracle\r\n\r\n                  CALL METHOD cl_hr_pnnnn_type_cast=>prelp_to_pnnnn\r\n                    EXPORTING\r\n                      prelp = gst_new_image\r\n                    IMPORTING\r\n                      pnnnn = gst_p2003.\r\n\r\n                  CLEAR: gt_data_p2003, gt_data_p2003[].\r\n                  CLEAR: st_p2003.\r\n                  st_p2003-action = gc_action.\r\n                  st_p2003-pernr  = gst_p2003-pernr.\r\n                  st_p2003-begda  = gst_p2003-begda.\r\n                  st_p2003-endda  = gst_p2003-endda.\r\n                  st_p2003-plans  = gst_p2003-plans.\r\n\r\n                  CLEAR: it_p0001, it_p0001[].\r\n                  CALL FUNCTION 'HR_READ_INFOTYPE'\r\n                    EXPORTING\r\n                      tclas           = 'A'\r\n                      pernr           = gst_p2003-pernr\r\n                      infty           = '0001'\r\n                      begda           = gst_p2003-begda\r\n                      endda           = gst_p2003-begda\r\n                    TABLES\r\n                      infty_tab       = it_p0001\r\n                    EXCEPTIONS\r\n                      infty_not_found = 1\r\n                      OTHERS          = 2.\r\n\r\n                  READ TABLE it_p0001    INTO st_p0001 INDEX 1.\r\n                  st_p2003-bukrs   = st_p0001-bukrs.\r\n\r\n                  CALL FUNCTION 'ZFMHCM_P2003' IN BACKGROUND TASK\r\n                    DESTINATION gv_dest_p2003\r\n                    EXPORTING\r\n                      st_p2003 = st_p2003\r\n                    TABLES\r\n                      it_p2003 = gt_data_p2003.\r\n\r\n                  CLEAR: st_p2003, gt_data_p2003[].\r\n                ENDIF.\r\n\r\n            ENDCASE.\r\n\r\n          ENDMETHOD.\r\n\r\n        ZFMHCM_P2001\r\n\r\n\r\n        FUNCTION ZFMHCM_P2001.\r\n        *\"----------------------------------------------------------------------\r\n        *\"*\"Interfase local\r\n        *\"  IMPORTING\r\n        *\"     VALUE(ST_P2001) TYPE  ZSTHCM_P2001 OPTIONAL\r\n        *\"  TABLES\r\n        *\"      IT_P2001 STRUCTURE  ZSTHCM_P2001\r\n        *\"  EXCEPTIONS\r\n        *\"      CLASSIC_EXCEPTION\r\n        *\"----------------------------------------------------------------------\r\n          APPEND st_p2001  TO it_p2001.\r\n\r\n        ENDFUNCTION."},{"id":"rec-90","category":"transacciones","title":"AMPLIACIÓN PARA MODIFICAR O CALCULAR LOS RESULTADOS DE LA EVALUACIÓN DEL DESEMPEÑO FUNCIÓN H","summary":"AMPLIACIÓN PARA MODIFICAR O CALCULAR LOS RESULTADOS DE LA EVALUACIÓN DEL DESEMPEÑO FUNCIÓN HRHAP_DOCUMENT_GET_DETAIL trx.: Phap_admin, Phap_create, Phap_change El ejemplo esta en clientes co","search":"AMPLIACIÓN PARA MODIFICAR O CALCULAR LOS RESULTADOS DE LA EVALUACIÓN DEL DESEMPEÑO FUNCIÓN HRHAP_DOCUMENT_GET_DETAIL trx.: Phap_admin, Phap_create, Phap_change El ejemplo esta en clientes conalvias Cuando es una accion al borrar el formato del desempeño por la phap_admin, se utiliza la funcion LHRHAP_UI_DOCUMENT_REPORTF05 al final del FORM f1100_uc_delete_appraisal","html":"AMPLIACIÓN PARA MODIFICAR O CALCULAR LOS RESULTADOS DE LA EVALUACIÓN DEL DESEMPEÑO\r\n\r\n        FUNCIÓN HRHAP_DOCUMENT_GET_DETAIL\r\n        trx.: Phap_admin, Phap_create, Phap_change\r\n        El ejemplo esta en clientes conalvias\r\n\r\n        Cuando es una accion al borrar el formato del desempeño por la phap_admin, se utiliza la funcion LHRHAP_UI_DOCUMENT_REPORTF05 al final del FORM f1100_uc_delete_appraisal"},{"id":"rec-91","category":"abap","title":"CONVERSION DE FECHAS EN FORMATO INTERNO SAP O VICEVERSA CONVERTIR FECHAS CONVIERTE FECHAS CO","summary":"CONVERSION DE FECHAS EN FORMATO INTERNO SAP O VICEVERSA CONVERTIR FECHAS CONVIERTE FECHAS CONVERSION_EXIT_PDATE_INPUT Conversion Exit for Domain GBDAT: DD/MM/YYYY -> YYYYMMDD NO UTILIZAR, NO","search":"CONVERSION DE FECHAS EN FORMATO INTERNO SAP O VICEVERSA CONVERTIR FECHAS CONVIERTE FECHAS CONVERSION_EXIT_PDATE_INPUT Conversion Exit for Domain GBDAT: DD/MM/YYYY -> YYYYMMDD NO UTILIZAR, NO FUNCIONA CON FECHAS SUPERIORES A LA FECHA DEL DIA. CONVERSION_EXIT_PDATE_OUTPUT Conversion Exit for Domain GBDAT: YYYYMMDD -> DD/MM/YYYY CONVERT_DATE_TO_INTERNAL DD/MM/YYYY -> YYYYMMDD OJO: revisar bien cada formato de entrada, por que puede no generar la salida.","html":"CONVERSION DE FECHAS EN FORMATO INTERNO SAP O VICEVERSA\r\n        CONVERTIR FECHAS CONVIERTE FECHAS\r\n\r\n        CONVERSION_EXIT_PDATE_INPUT    Conversion Exit for Domain GBDAT: DD/MM/YYYY -> YYYYMMDD NO UTILIZAR, NO FUNCIONA CON FECHAS SUPERIORES A LA FECHA DEL DIA.\r\n\r\n        CONVERSION_EXIT_PDATE_OUTPUT   Conversion Exit for Domain GBDAT: YYYYMMDD -> DD/MM/YYYY\r\n\r\n        CONVERT_DATE_TO_INTERNAL DD/MM/YYYY -> YYYYMMDD\r\n\r\n        OJO: revisar bien cada formato de entrada, por que puede no generar la salida."},{"id":"rec-92","category":"abap","title":"LECTURA DE CLUSTER DESDE EL PROGRAMA ESTÁNDAR HCOCEDT0 FUNCTION zhcm_leer_clusterco","summary":"LECTURA DE CLUSTER DESDE EL PROGRAMA ESTÁNDAR HCOCEDT0 FUNCTION zhcm_leer_clusterco. *\"---------------------------------------------------------------------- *\"*\"Interfase local *\" IMPORTING","search":"LECTURA DE CLUSTER DESDE EL PROGRAMA ESTÁNDAR HCOCEDT0 FUNCTION zhcm_leer_clusterco. *\"---------------------------------------------------------------------- *\"*\"Interfase local *\" IMPORTING *\" REFERENCE(P_PERNR) TYPE PERNR_D *\" REFERENCE(P_OCRSN) TYPE PAY_OCRSN OPTIONAL *\" REFERENCE(P_BEGDA) TYPE BEGDA *\" REFERENCE(P_ENDDA) TYPE ENDDA *\" REFERENCE(P_PAYTY) TYPE PAYTY OPTIONAL *\" REFERENCE(P_PAYID) TYPE PAYID OPTIONAL *\" REFERENCE(P_BONDT) TYPE BONDT OPTIONAL *\" REFERENCE(P_ABKRS) TYPE ABKRS *\" REFERENCE(P_PABRP) TYPE PABRP *\" REFERENCE(P_PABRJ) TYPE PABRJ *\" TABLES *\" TB_RT_ING_DED TYPE PC207_TAB OPTIONAL *\" TB_RT_TOTAL TYPE PC207_TAB OPTIONAL *\" TB_CRT TYPE HRPAY99_CRT OPTIONAL *\" TB_BT TYPE HRPAY99_BT OPTIONAL *\" TB_COABS TYPE HRPAYCO_ABSCO OPTIONAL *\" EXCEPTIONS *\" ERROR_EN_PARAMETROS *\" PERIODO_SIN_CLUSTER *\" NO_HAY_DATOS *\"---------------------------------------------------------------------- *----------------------------------------------------------------------- * In der XRT befinden sich die Lohnarten nach Disposition * auf Fenster/Gruppe/Untergruppe und nach Seitendisposition *----------------------------------------------------------------------- * Global data declarations *----------------------------------------------------------------------- * In der XRT befinden sich die Lohnarten nach Disposition * auf Fenster/Gruppe/Untergruppe und nach Seitendisposition *----------------------------------------------------------------------- DATA: BEGIN OF xrt OCCURS 80, \"vormals 200 *---------------------------------------------------------------------* * Stets auch OXRT und SPLITS mitpflegen * *---------------------------------------------------------------------* pagno TYPE i, linno TYPE i, windo LIKE t512e-windo, grppe LIKE t512e-grppe, kennz(1), seqno(2), seqn2 LIKE p512e-seqn2, rueckd TYPE d, fpbeg LIKE pc261-fpbeg, fpend LIKE pc261-fpend, apznr LIKE pc207-apznr, cntr1 LIKE pc207-cntr1, cntr2 LIKE pc207-cntr2, cntr3 LIKE pc207-cntr3, alznr LIKE pc207-alznr, c1znr LIKE pc207-c1znr, btznr LIKE pc207-btznr, abznr LIKE pc207-abznr, v0typ LIKE pc207-v0typ, v0znr LIKE pc207-v0znr, lfdnr LIKE t512e-lfdnr, colno LIKE t512e-colno, tname LIKE t512e-tabna, table LIKE t512e-tabna, splts TYPE boolean, abart LIKE t503-abart, lgart TYPE lgart, \"YMO1117676 zeinh LIKE p0009-zeinh, betpe LIKE pc207-betpe, anzhl LIKE pc207-anzhl, betrg LIKE pc207-betrg, betpc(20) TYPE c, ltype LIKE t512e-ltype, fconv LIKE t512e-fconv, regel LIKE t512e-regel, delet TYPE boolean, * tabix like sy-tabix, \"pointer to other table \"ALRK014138 tabix(5) TYPE n, \"pointer to other table \"ALRK014138 * lsindex(3), \"ALRK014138 * leindex(3), \"ALRK014138 sortf(20) TYPE c, pernr LIKE pernr-pernr, \"VKIK011129 rte_curr LIKE pc207-rte_curr, \"XULP30K060064 END OF xrt. DATA: BEGIN OF bt OCCURS 10. INCLUDE STRUCTURE pc209. DATA: END OF bt. *Abrechnungsergebnis: kumulierte Ergebnistabelle DATA: BEGIN OF crt OCCURS 0. INCLUDE STRUCTURE pc208 . DATA: END OF crt . *Abrechnungsergebnis: Ergebnistabelle DATA: BEGIN OF rt OCCURS 0. INCLUDE STRUCTURE pc207 . DATA: END OF rt . DATA: BEGIN OF coabs OCCURS 0. INCLUDE STRUCTURE pc2co_abs. DATA: END OF coabs . DATA: nom_xrt_final TYPE char30, nom_xrt_total_final TYPE char30, nom_xcrt_final TYPE char30, nom_bt_final TYPE char30, nom_coabs_final TYPE char30, zleer_cluster TYPE c, zgc_memory TYPE char50, gn_pabrj TYPE pabrj, gn_pabrp TYPE pabrp, lst_rt TYPE pc207. RANGES: pnpstat2 FOR pernr-stat2. *** Este modulo lo que permite es realizar un llamado al programa HCOCEDT0 *** para realizar un IMPORT las tablas leidas dentro del programa HCOCEDT0 *** la ampliacion se debe realizar en el *** include RPCEDS09 al final de FORM PROCESS_PERNR - para el programa HCOCEDT0 *** Debe tener en cuenta que el mismo contenido de la variable ZGC_MEMORY deben ser iguales *** para este ejemplo 'ZMFPY_LEE_CLUSTERCO_' *** En este include se debe realizar la definicion exactamente igual de: *** - Los nombres y tamaños de las tablas *** - Los nombres y tamaños de las variables con los nombres de los nombres de las tablas *** Este modulo sirve para implementarse en diferentes reportes, por lo cual las tablas *** deben estar con el check de opcional *** REVISE E IMPLEMENTE el codigo que debe incluirse en la ampliacion del include RPCEDS09 CONCATENATE 'XRT_FINAL' p_pernr INTO nom_xrt_final. CONCATENATE 'XRT_TOTAL_FINAL' p_pernr INTO nom_xrt_total_final. CONCATENATE 'XCRT_FINAL' p_pernr INTO nom_xcrt_final. CONCATENATE 'BT_FINAL' p_pernr INTO nom_bt_final. CONCATENATE 'COABS_FINAL' p_pernr INTO nom_coabs_final. zleer_cluster = abap_true. CONCATENATE 'ZMFPY_LEE_CLUSTERCO_' p_pernr INTO zgc_memory. EXPORT zleer_cluster TO MEMORY ID zgc_memory. FREE MEMORY ID: nom_xrt_final, nom_xrt_total_final, nom_xcrt_final, nom_bt_final. IF p_payty IS INITIAL. SUBMIT hcocedt0 EXPORTING LIST TO MEMORY AND RETURN WITH pnpxabkr = p_abkrs WITH pnptimra = abap_true WITH pnppabrp = p_pabrp WITH pnppabrj = p_pabrj WITH pnppernr-low = p_pernr WITH pnpabkrs-low = p_abkrs WITH pnpstat2 IN pnpstat2 WITH ocrsn = p_ocrsn WITH payty = p_payty WITH payid = p_payid WITH bondt = p_bondt WITH formular = 'COF1' WITH andruck = 'A' WITH rueckd = abap_true WITH rueckr = 'A' WITH sort_rr = '1'\"'3' \"'1' Ajuste HRP 29.03.2016 para que muestre los conceptos retroactivos WITH sprache = 'B' WITH prt_prot = abap_true. ELSE. CLEAR: sy-subrc. CALL FUNCTION 'HR_PAYROLL_PERIOD_GET' EXPORTING payroll_area = p_abkrs date = p_bondt IMPORTING payroll_year = gn_pabrj payroll_period = gn_pabrp EXCEPTIONS no_entry_t549a = 1 no_entry_t549q = 2 OTHERS = 3. IF sy-subrc 0. * Implement suitable error handling here ENDIF. SUBMIT hcocedt0 EXPORTING LIST TO MEMORY AND RETURN WITH pnpxabkr = p_abkrs WITH pnptimra = abap_true WITH pnppabrp = gn_pabrp WITH pnppabrj = gn_pabrj WITH pnppernr-low = p_pernr WITH pnpabkrs-low = p_abkrs WITH pnpstat2 IN pnpstat2 WITH ocrsn = p_ocrsn WITH payty = p_payty WITH payid = p_payid WITH bondt = p_bondt WITH formular = 'COF1' WITH andruck = 'A' WITH rueckd = abap_true WITH rueckr = 'A' WITH sort_rr = '1' \"'3' \"'1' Ajuste HRP 29.03.2016 para que muestre los conceptos retroactivos WITH sprache = 'B' WITH prt_prot = abap_true. ENDIF. FREE MEMORY ID: zleer_cluster. IMPORT xrt FROM MEMORY ID nom_xrt_final. IMPORT rt FROM MEMORY ID nom_xrt_total_final. IMPORT crt FROM MEMORY ID nom_xcrt_final. IMPORT bt FROM MEMORY ID nom_bt_final. IMPORT coabs FROM MEMORY ID nom_coabs_final. LOOP AT xrt WHERE tname = 'RT'. MOVE-CORRESPONDING xrt TO lst_rt. lst_rt-lgart = xrt-lgart. lst_rt-betpe = xrt-betpe. lst_rt-anzhl = xrt-anzhl. lst_rt-betrg = xrt-betrg. COLLECT lst_rt INTO tb_rt_ing_ded. ENDLOOP. DELETE tb_rt_ing_ded WHERE anzhl = 0 AND betrg = 0. tb_bt[] = bt[]. tb_rt_total[] = rt[]. tb_crt[] = crt[]. tb_coabs[] = coabs[]. FREE MEMORY ID: nom_xrt_final, nom_xrt_total_final, nom_xcrt_final, nom_bt_final, nom_coabs_final. ENDFUNCTION. ENHANCEMENT 1 ZENHHCM_002. \"active version **** Ampliacion en el programa HCOCEDT0 en el include RPCEDS09 *** al final del FORM PROCESS_PERNR, para retornar los valores de la lectura de cluster *** al modulo de funciones ZHCM_LEER_CLUSTERCO (Colombia) *** Debe tener en cuenta que el mismo contenido de la variable ZGC_MEMORY deben ser iguales *** para este ejemplo 'ZMFPY_LEE_CLUSTERCO_' *** En este include se debe realizar la definicion exactamente igual de: *** - Los nombres y tamaños de las tablas *** - Los nombres y tamaños de las variables con los nombres de los nombres de las tablas *** REVISE E IMPLEMENTE el codigo que debe implementarse en el modulo de funciones ZHCM_LEER_CLUSTERCO (Colombia) DATA: nom_xrt_final TYPE char30, nom_xrt_total_final TYPE char30, nom_xcrt_final TYPE char30, nom_bt_final TYPE char30, \"La tabla xbt no viene con el campo BANKL correcto nom_coabs_final TYPE char30, zgc_memory TYPE char50, zleer_cluster TYPE c. CONCATENATE 'ZMFPY_LEE_CLUSTERCO_' pernr-pernr INTO zgc_memory. IMPORT zleer_cluster FROM MEMORY ID zgc_memory. IF zleer_cluster = abap_true AND molga = '38'. CONCATENATE 'XRT_TOTAL_FINAL' pernr-pernr INTO nom_xrt_total_final. CONCATENATE 'XRT_FINAL' pernr-pernr INTO nom_xrt_final. CONCATENATE 'XCRT_FINAL' pernr-pernr INTO nom_xcrt_final. CONCATENATE 'BT_FINAL' pernr-pernr INTO nom_bt_final. CONCATENATE 'COABS_FINAL' pernr-pernr INTO nom_coabs_final. EXPORT xrt TO MEMORY ID nom_xrt_final. \" Pasarla a memoria EXPORT rt TO MEMORY ID nom_xrt_total_final. EXPORT crt TO MEMORY ID nom_xcrt_final. EXPORT bt TO MEMORY ID nom_bt_final. EXPORT coabs TO MEMORY ID nom_coabs_final. PERFORM REFRESH_PERNR. PERFORM REFRESH_PERNR_NATIO. PERFORM REFRESH_PERNR_MOD. ENDIF. ENDENHANCEMENT.","html":"LECTURA DE CLUSTER DESDE EL PROGRAMA ESTÁNDAR HCOCEDT0\r\n        FUNCTION zhcm_leer_clusterco.\r\n        *\"----------------------------------------------------------------------\r\n        *\"*\"Interfase local\r\n        *\"  IMPORTING\r\n        *\"     REFERENCE(P_PERNR) TYPE  PERNR_D\r\n        *\"     REFERENCE(P_OCRSN) TYPE  PAY_OCRSN OPTIONAL\r\n        *\"     REFERENCE(P_BEGDA) TYPE  BEGDA\r\n        *\"     REFERENCE(P_ENDDA) TYPE  ENDDA\r\n        *\"     REFERENCE(P_PAYTY) TYPE  PAYTY OPTIONAL\r\n        *\"     REFERENCE(P_PAYID) TYPE  PAYID OPTIONAL\r\n        *\"     REFERENCE(P_BONDT) TYPE  BONDT OPTIONAL\r\n        *\"     REFERENCE(P_ABKRS) TYPE  ABKRS\r\n        *\"     REFERENCE(P_PABRP) TYPE  PABRP\r\n        *\"     REFERENCE(P_PABRJ) TYPE  PABRJ\r\n        *\"  TABLES\r\n        *\"      TB_RT_ING_DED TYPE  PC207_TAB OPTIONAL\r\n        *\"      TB_RT_TOTAL TYPE  PC207_TAB OPTIONAL\r\n        *\"      TB_CRT TYPE  HRPAY99_CRT OPTIONAL\r\n        *\"      TB_BT TYPE  HRPAY99_BT OPTIONAL\r\n        *\"      TB_COABS TYPE  HRPAYCO_ABSCO OPTIONAL\r\n        *\"  EXCEPTIONS\r\n        *\"      ERROR_EN_PARAMETROS\r\n        *\"      PERIODO_SIN_CLUSTER\r\n        *\"      NO_HAY_DATOS\r\n        *\"----------------------------------------------------------------------\r\n        *-----------------------------------------------------------------------\r\n        * In der XRT befinden sich die Lohnarten nach Disposition\r\n        * auf Fenster/Gruppe/Untergruppe und nach Seitendisposition\r\n        *-----------------------------------------------------------------------\r\n\r\n        *       Global data declarations\r\n        *-----------------------------------------------------------------------\r\n        * In der XRT befinden sich die Lohnarten nach Disposition\r\n        * auf Fenster/Gruppe/Untergruppe und nach Seitendisposition\r\n        *-----------------------------------------------------------------------\r\n          DATA: BEGIN OF xrt OCCURS  80,         \"vormals 200\r\n        *---------------------------------------------------------------------*\r\n        * Stets auch OXRT und SPLITS mitpflegen                               *\r\n        *---------------------------------------------------------------------*\r\n                  pagno     TYPE i,\r\n                  linno     TYPE i,\r\n                  windo     LIKE t512e-windo,\r\n                  grppe     LIKE t512e-grppe,\r\n                  kennz(1),\r\n                  seqno(2),\r\n                  seqn2     LIKE p512e-seqn2,\r\n                  rueckd    TYPE d,\r\n                  fpbeg     LIKE pc261-fpbeg,\r\n                  fpend     LIKE pc261-fpend,\r\n                  apznr     LIKE pc207-apznr,\r\n                  cntr1     LIKE pc207-cntr1,\r\n                  cntr2     LIKE pc207-cntr2,\r\n                  cntr3     LIKE pc207-cntr3,\r\n                  alznr     LIKE pc207-alznr,\r\n                  c1znr     LIKE pc207-c1znr,\r\n                  btznr     LIKE pc207-btznr,\r\n                  abznr     LIKE pc207-abznr,\r\n                  v0typ     LIKE pc207-v0typ,\r\n                  v0znr     LIKE pc207-v0znr,\r\n                  lfdnr     LIKE t512e-lfdnr,\r\n                  colno     LIKE t512e-colno,\r\n                  tname     LIKE t512e-tabna,\r\n                  table     LIKE t512e-tabna,\r\n                  splts     TYPE boolean,\r\n                  abart     LIKE t503-abart,\r\n                  lgart     TYPE lgart,                             \"YMO1117676\r\n                  zeinh     LIKE p0009-zeinh,\r\n                  betpe     LIKE pc207-betpe,\r\n                  anzhl     LIKE pc207-anzhl,\r\n                  betrg     LIKE pc207-betrg,\r\n                  betpc(20) TYPE c,\r\n                  ltype     LIKE t512e-ltype,\r\n                  fconv     LIKE t512e-fconv,\r\n                  regel     LIKE t512e-regel,\r\n                  delet     TYPE boolean,\r\n        *       tabix like sy-tabix,    \"pointer to other table     \"ALRK014138\r\n                  tabix(5)  TYPE n,        \"pointer to other table     \"ALRK014138\r\n        *       lsindex(3),                                         \"ALRK014138\r\n        *       leindex(3),                                         \"ALRK014138\r\n                  sortf(20) TYPE c,\r\n                  pernr     LIKE pernr-pernr,                       \"VKIK011129\r\n                  rte_curr  LIKE pc207-rte_curr,  \"XULP30K060064\r\n                END OF xrt.\r\n\r\n          DATA:\r\n            BEGIN OF bt OCCURS 10.\r\n              INCLUDE STRUCTURE pc209.\r\n          DATA:  END OF bt.\r\n\r\n        *Abrechnungsergebnis: kumulierte Ergebnistabelle\r\n          DATA: BEGIN OF crt OCCURS 0.\r\n                  INCLUDE STRUCTURE pc208 .\r\n          DATA: END OF crt .\r\n\r\n        *Abrechnungsergebnis: Ergebnistabelle\r\n          DATA: BEGIN OF rt OCCURS 0.\r\n                  INCLUDE STRUCTURE pc207 .\r\n          DATA: END OF rt .\r\n\r\n          DATA: BEGIN OF coabs OCCURS 0.\r\n                  INCLUDE STRUCTURE pc2co_abs.\r\n          DATA: END OF coabs .\r\n\r\n          DATA: nom_xrt_final       TYPE char30,\r\n                nom_xrt_total_final TYPE char30,\r\n                nom_xcrt_final      TYPE char30,\r\n                nom_bt_final        TYPE char30,\r\n                nom_coabs_final     TYPE char30,\r\n                zleer_cluster       TYPE c,\r\n                zgc_memory          TYPE char50,\r\n                gn_pabrj            TYPE pabrj,\r\n                gn_pabrp            TYPE pabrp,\r\n                lst_rt              TYPE pc207.\r\n\r\n          RANGES: pnpstat2 FOR pernr-stat2.\r\n        ***  Este modulo lo que permite es realizar un llamado al programa HCOCEDT0\r\n        ***  para realizar un IMPORT las tablas leidas dentro del programa HCOCEDT0\r\n        ***  la ampliacion se debe realizar en el\r\n\r\n        ***  include RPCEDS09 al final de FORM PROCESS_PERNR - para el programa HCOCEDT0\r\n        ***  Debe tener en cuenta que el mismo contenido de la variable ZGC_MEMORY deben ser iguales\r\n        ***  para este ejemplo 'ZMFPY_LEE_CLUSTERCO_'\r\n        ***  En este include se debe realizar la definicion exactamente igual de:\r\n        ***  - Los nombres y tamaños de las tablas\r\n        ***  - Los nombres y tamaños de las variables con los nombres de los nombres de las tablas\r\n\r\n        ***  Este modulo sirve para implementarse en diferentes reportes, por lo cual las tablas\r\n        ***  deben estar con el check de opcional\r\n        ***  REVISE E IMPLEMENTE el codigo que debe incluirse en la ampliacion del include RPCEDS09\r\n\r\n          CONCATENATE 'XRT_FINAL'         p_pernr INTO nom_xrt_final.\r\n          CONCATENATE 'XRT_TOTAL_FINAL'   p_pernr INTO nom_xrt_total_final.\r\n          CONCATENATE 'XCRT_FINAL'        p_pernr INTO nom_xcrt_final.\r\n          CONCATENATE 'BT_FINAL'          p_pernr INTO nom_bt_final.\r\n          CONCATENATE 'COABS_FINAL'       p_pernr INTO nom_coabs_final.\r\n\r\n          zleer_cluster             = abap_true.\r\n\r\n          CONCATENATE 'ZMFPY_LEE_CLUSTERCO_' p_pernr INTO zgc_memory.\r\n          EXPORT zleer_cluster      TO MEMORY ID zgc_memory.\r\n\r\n          FREE MEMORY ID: nom_xrt_final, nom_xrt_total_final, nom_xcrt_final, nom_bt_final.\r\n\r\n          IF p_payty          IS INITIAL.\r\n            SUBMIT hcocedt0 EXPORTING LIST TO MEMORY AND RETURN\r\n                              WITH pnpxabkr = p_abkrs\r\n                              WITH pnptimra = abap_true\r\n                              WITH pnppabrp = p_pabrp\r\n                              WITH pnppabrj = p_pabrj\r\n                              WITH pnppernr-low = p_pernr\r\n                              WITH pnpabkrs-low = p_abkrs\r\n                              WITH pnpstat2     IN pnpstat2\r\n\r\n                              WITH ocrsn    = p_ocrsn\r\n                              WITH payty    = p_payty\r\n                              WITH payid    = p_payid\r\n                              WITH bondt    = p_bondt\r\n\r\n                              WITH formular = 'COF1'\r\n                              WITH andruck  = 'A'\r\n                              WITH rueckd   = abap_true\r\n                              WITH rueckr   = 'A'\r\n                              WITH sort_rr  = '1'\"'3'  \"'1'  Ajuste HRP 29.03.2016 para que muestre los conceptos retroactivos\r\n                              WITH sprache  = 'B'\r\n                              WITH prt_prot = abap_true.\r\n          ELSE.\r\n            CLEAR: sy-subrc.\r\n\r\n            CALL FUNCTION 'HR_PAYROLL_PERIOD_GET'\r\n              EXPORTING\r\n                payroll_area   = p_abkrs\r\n                date           = p_bondt\r\n              IMPORTING\r\n                payroll_year   = gn_pabrj\r\n                payroll_period = gn_pabrp\r\n              EXCEPTIONS\r\n                no_entry_t549a = 1\r\n                no_entry_t549q = 2\r\n                OTHERS         = 3.\r\n\r\n            IF sy-subrc <> 0.\r\n        * Implement suitable error handling here\r\n            ENDIF.\r\n\r\n            SUBMIT hcocedt0 EXPORTING LIST TO MEMORY AND RETURN\r\n                              WITH pnpxabkr = p_abkrs\r\n                              WITH pnptimra = abap_true\r\n                              WITH pnppabrp = gn_pabrp\r\n                              WITH pnppabrj = gn_pabrj\r\n                              WITH pnppernr-low = p_pernr\r\n                              WITH pnpabkrs-low = p_abkrs\r\n                              WITH pnpstat2     IN pnpstat2\r\n\r\n                              WITH ocrsn    = p_ocrsn\r\n                              WITH payty    = p_payty\r\n                              WITH payid    = p_payid\r\n                              WITH bondt    = p_bondt\r\n\r\n                              WITH formular = 'COF1'\r\n                              WITH andruck  = 'A'\r\n                              WITH rueckd   = abap_true\r\n                              WITH rueckr   = 'A'\r\n                              WITH sort_rr  = '1' \"'3'  \"'1'  Ajuste HRP 29.03.2016 para que muestre los conceptos retroactivos\r\n                              WITH sprache  = 'B'\r\n                              WITH prt_prot = abap_true.\r\n          ENDIF.\r\n\r\n          FREE MEMORY ID: zleer_cluster.\r\n          IMPORT xrt             FROM MEMORY ID nom_xrt_final.\r\n          IMPORT rt              FROM MEMORY ID nom_xrt_total_final.\r\n          IMPORT crt             FROM MEMORY ID nom_xcrt_final.\r\n          IMPORT bt              FROM MEMORY ID nom_bt_final.\r\n          IMPORT coabs           FROM MEMORY ID nom_coabs_final.\r\n\r\n          LOOP AT xrt       WHERE tname = 'RT'.\r\n            MOVE-CORRESPONDING xrt  TO lst_rt.\r\n            lst_rt-lgart     = xrt-lgart.\r\n            lst_rt-betpe     = xrt-betpe.\r\n            lst_rt-anzhl     = xrt-anzhl.\r\n            lst_rt-betrg     = xrt-betrg.\r\n            COLLECT lst_rt   INTO tb_rt_ing_ded.\r\n          ENDLOOP.\r\n\r\n          DELETE tb_rt_ing_ded WHERE anzhl  = 0 AND\r\n                                    betrg  = 0.\r\n\r\n          tb_bt[]                = bt[].\r\n          tb_rt_total[]          = rt[].\r\n          tb_crt[]               = crt[].\r\n          tb_coabs[]             = coabs[].\r\n\r\n          FREE MEMORY ID: nom_xrt_final, nom_xrt_total_final, nom_xcrt_final,\r\n                          nom_bt_final, nom_coabs_final.\r\n\r\n        ENDFUNCTION.\r\n\r\n        ENHANCEMENT 1  ZENHHCM_002.    \"active vers  Y El cluster debe ser el que se haya definido, para el ejemplo RX. • Para ejecutar el reporte: El BEGDA Y ENDDA deben SER IGUALES y contener la fecha, de trabajo del ultimo dia que estuvo activo el empleado. NO SIRVE DARLE UN RANGO DE FECHAS. • Se debe modificar la clase ZCL_HRPAYPE_TRM_COUNTRY, en el método CHANGE_SCREEN_FIELDS para visualizar el motivo de terminación, pero como ese método es heredado, lo que se hizo fue ampliar el método y se coloco: • Se debe modificar la clase ZCL_HRPAYPE_TRM_COUNTRY, en el método SETUP. • Tablas: V_T52OCC, V_T52OCR y V_T52OCV Aquí se configura el motivo 0095 • Recision contrato: V_T5F99T1 subtipo depende de cada país, pero en el ejemplo se configuro 0713 ruta spro -> Gestión de personal -> Gestión de personal -> Datos de nómina -> Rescisión del contrato (FR) • Que se debe hacer para que simule correctamente y no haya necesidad de ingresar el retiro en real: o Modificar parámetros de la clase ZCL_HRPAYPE_TRM_COUNTRY en el método CONSTRUCTOR ejemplo en Texmoda o En la clase ZCL_HRPAYPE_TRM_COUNTRY en el método INSERT, colocar país ejemplo en Texmoda o En el momento de crear el it0713 eso ocurre en la clase ZCL_HRPAYPE_TRM_COUNTRY en el método SIMULATE, ejemplo en Texmoda o Crear nueva ampliación en clase CL_HRPAYLA_TERMINATION método GET_TRM_PAYMENTS se amplia a GET_TRM_PAYMENTS_V2, eso sirve para que los resultados de pago, o ingreso o lo que se necesite sean almacenados y luego estén disponible para visualizar en los iconos Pagos (Clase de evaluación 2 Asignación CC-nóminas para impresión formulario (Aquí se coloca 01 o F2 o etc)) y Total de Pagos (Clase de evaluación 2 Asignación CC-nóminas para impresión formulario (aquí se coloca 03 o F3 o etc)), ejemplo en Texmoda o Se copian y se modifican todos los Include necesarios para colocarles el país respectivo • La liquidación se ejecuta en la FUNCTION HR_MX_PAYROLL línea 192 • El neto se encuentra en la FUNCTION HR_MX_GET_RT_FROM_MEM","html":"CONFIGURAR NOMINAS DE TERMINACIÓN IN  la clase ZCL_HRPAYPE_TRM_COUNTRY en el método CONSTRUCTOR ejemplo en Texmoda\r\n        o\tEn la clase ZCL_HRPAYPE_TRM_COUNTRY en el método INSERT, colocar país ejemplo en Texmoda\r\n\r\n        o\tEn el momento de crear el it0713 eso ocurre en la clase ZCL_HRPAYPE_TRM_COUNTRY en el método SIMULATE, ejemplo en Texmoda\r\n        o\tCrear nueva ampliación en clase CL_HRPAYLA_TERMINATION método GET_TRM_PAYMENTS se amplia a GET_TRM_PAYMENTS_V2, eso sirve para que los resultados de pago, o ingreso o lo que se necesite sean almacenados y luego estén disponible para visualizar en los iconos Pagos (Clase de evaluación 2 Asignación CC-nóminas para impresión formulario (Aquí se coloca 01 o F2 o etc)) y Total de Pagos (Clase de evaluación 2 Asignación CC-nóminas para impresión formulario (aquí se coloca 03 o F3 o etc)), ejemplo en Texmoda\r\n        o\tSe copian y se modifican todos los Include necesarios para colocarles el país respectivo\r\n\r\n        •\tLa liquidación se ejecuta en la FUNCTION HR_MX_PAYROLL línea 192\r\n        •\tEl neto se encuentra en la FUNCTION HR_MX_GET_RT_FROM_MEM"},{"id":"rec-100","category":"nomina","title":"DUMP EN NOMINA AL LIQUIDAR LOS INTERESES A LAS CESANTÍAS la vista V_T7CO23 El método para la","summary":"DUMP EN NOMINA AL LIQUIDAR LOS INTERESES A LAS CESANTÍAS la vista V_T7CO23 El método para la sociedad es 1 y debe ser 2","search":"DUMP EN NOMINA AL LIQUIDAR LOS INTERESES A LAS CESANTÍAS la vista V_T7CO23 El método para la sociedad es 1 y debe ser 2","html":"DUMP EN NOMINA AL LIQUIDAR LOS INTERESES A LAS CESANTÍAS\r\n        la vista V_T7CO23 El método para la sociedad es 1 y debe ser 2"},{"id":"rec-101","category":"nomina","title":"TABLA CONFIGURACION NOMINA ADICIONAL V_T5F99K2","summary":"TABLA CONFIGURACION NOMINA ADICIONAL V_T5F99K2","search":"TABLA CONFIGURACION NOMINA ADICIONAL V_T5F99K2","html":"TABLA CONFIGURACION NOMINA ADICIONAL\r\n        V_T5F99K2"},{"id":"rec-102","category":"nomina","title":"CUANDO NO APAREZCAN LOS INFOTIPO SO Y COSSA Para los casos en los cuales debemos afectar el infotipo 2001 de una nomina ya liquidada, se debe crear un registro en el Infotipo 262 Retroactivida","search":"RETROACTIVIDAD IT262 – PARA COSSO Y COSSA Para los casos en los cuales debemos afectar el infotipo 2001 de una nomina ya liquidada, se debe crear un registro en el Infotipo 262 Retroactividad. Ello permitirá llevar los valores recalculados de la seguridad social al periodo actual. Por ejemplo: Para el empleado 70000704 se efectuó un cambio en el IT2001 que afecta la seguridad social y eventualmente la retención en la fuente si hubiere lugar. Se graba un registro en el IT262 de la siguiente forma: El subtipo 0001 si el recalculo se va a efectuar en un periodo de nomina regular. Motivo 0002 ya que estamos corrigiendo novedades de la primera quincena. Área de nomina a la cual pertenece el empleado. Periodo de calculo de nomina: el periodo en el cual queremos que nos traiga los resultados del periodo anterior.","html":"RETROACTIVIDAD IT262 – PARA COSSO Y COSSA\r\n\r\n        Para los casos en los cuales debemos afectar el infotipo 2001 de una nomina ya liquidada, se debe crear un registro en el Infotipo 262 Retroactividad.\r\n        Ello permitirá llevar los valores recalculados de la seguridad social al periodo actual.\r\n\r\n        Por ejemplo:\r\n        Para el empleado 70000704 se efectuó un cambio en el IT2001 que afecta la seguridad social y eventualmente la retención en la fuente si hubiere lugar.\r\n\r\n        Se graba un registro en el IT262 de la siguiente forma:\r\n        <img src=\"img/IT2621.jpg\"  loading=\"lazy\" alt=\"IT2621\">\r\n        El subtipo 0001 si el recalculo se va a efectuar en un periodo de nomina regular.\r\n\r\n        Motivo 0002 ya que estamos corrigiendo novedades de la primera quincena.\r\n        <img src=\"img/IT2622.jpg\"  loading=\"lazy\" alt=\"IT2622\">\r\n        Área de nomina a la cual pertenece el empleado.\r\n        Periodo de calculo de nomina: el per     const categoryGrid = document.querySelector('#categoryGrid');
    const emptyState = document.querySelector('#emptyState');
    const detailTitle = document.querySelector('#detailTitle');
    const detailDescription = document.querySelector('#detailDescription');
    const detailTags = document.querySelector('#detailTags');
    const articleGrid = document.querySelector('#articleGrid');
    const articleSectionTitle = document.querySelector('#articleSectionTitle');
    const viewAllButton = document.querySelector('#viewAllButton');
    const viewerTitle = document.querySelector('#viewerTitle');
    const viewerBody = document.querySelector('#viewerBody');
    let currentCategory = 'transacciones';
    let showingAllRecords = false;
    let currentVisibleRecords = [];

    function renderCategories() {
      categoryGrid.innerHTML = categories.map((category) => `
        <a class="category-card" href="#" data-category="${category.key}" data-search="${category.label} ${category.description}">
          <span class="icon-box" style="background: ${category.color};">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">${category.iconSvg}</svg>
          </span>
          <h3>${category.label}</h3>
          <p>${category.description}</p>
          <span class="card-footer">${category.count} registros <span class="arrow">›</span></span>
        </a>
      `).join('');

      categoryGrid.querySelectorAll('[data-category]').forEach((card) => {
        card.addEventListener('click', (event) => {
          event.preventDefault();
          renderCategory(card.dataset.category);
          document.querySelector('#categoryDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      });
    }

    function cardTemplate(record) {
      return `
        <button class="article-card" type="button" data-id="${record.id}" data-search="${record.title} ${record.summary} ${record.search}">
          <span class="doc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>
          </span>
          <span>
            <span class="article-title">${record.title}</span>
            <span class="article-meta">${record.summary}</span>
          </span>
          <span class="arrow">›</span>
        </button>
      `;
    }

    function renderRecordList(list) {
      currentVisibleRecords = list;
      articleGrid.innerHTML = list.map(cardTemplate).join('');
      articleGrid.querySelectorAll('[data-id]').forEach((button) => {
        button.addEventListener('click', () => {
          const record = records.find((item) => item.id === button.dataset.id);
          if (record) renderViewer(record);
        });
      });
      emptyState.classList.toggle('visible', list.length === 0);
    }

    function renderViewer(record) {
      viewerTitle.textContent = record.title;
      viewerBody.innerHTML = record.html;
      document.querySelector('#visor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCategory(categoryKey, showAll = false) {
      const category = categories.find((item) => item.key === categoryKey);
      if (!category) return;

      currentCategory = categoryKey;
      showingAllRecords = showAll;
      detailTitle.textContent = category.label;
      detailDescription.textContent = category.description;
      const categoryRecords = records.filter((record) => record.category === categoryKey);
      detailTags.innerHTML = categoryRecords.slice(0, 8).map((record) => `<span>${record.title}</span>`).join('');
      document.querySelectorAll('[data-category]').forEach((card) => {
        card.classList.toggle('active', card.dataset.category === categoryKey);
      });

      const visibleRecords = showAll ? categoryRecords : categoryRecords.slice(0, 6);
      articleSectionTitle.textContent = `${showAll ? 'Todos los registros' : 'Registros destacados'} de ${category.label}`;
      viewAllButton.textContent = showAll ? 'Ver destacados' : 'Ver todos';
      viewAllButton.setAttribute('aria-expanded', String(showAll));
      renderRecordList(visibleRecords);
      if (visibleRecords[0]) renderViewer(visibleRecords[0]);
    }

    viewAllButton.addEventListener('click', () => {
      renderCategory(currentCategory, !showingAllRecords);
      document.querySelector('#registros').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    renderCategories();
    renderCategory('transacciones');
  </script>
