<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiencia SAP</title>
    <link rel="stylesheet" href="./styles/styles_experience.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <strong>Hernando Ramirez P.</strong>
          <span id="id_profile_subtitle"></span>
        </div>
        <button
          id="id_goToHomePage"
          class="home-link"
          type="button"
          onclick="goToHomePage()"
        ></button>
      </header>

      <section class="hero" aria-labelledby="id_experience_h2">
        <p id="id_profile_label" class="eyebrow"></p>
        <h1 id="id_experience_h2"></h1>
      </section>

      <section aria-labelledby="id_featured_title">
        <div class="experience-header">
          <h2 id="id_featured_title"></h2>
          <a id="id_view_detail" href="#id_experience_detail"></a>
        </div>

        <div id="id_experience_grid" class="experience-grid"></div>
      </section>

      <section id="id_experience_detail" class="detail" aria-live="polite">
        <div class="detail-heading">
          <p id="id_detail_period" class="period"></p>
          <h2 id="id_detail_company"></h2>
          <p id="id_detail_role"></p>
        </div>

        <div class="detail-panel">
          <h3 id="id_detail_focus_title"></h3>
          <p id="id_detail_focus"></p>

          <div>
            <h3 id="id_projects_title"></h3>
            <ul id="id_projects_list" class="project-list"></ul>
          </div>

          <div id="id_detail_tags" class="tags" aria-label="Areas clave"></div>
        </div>
      </section>
    </main>

    <script src="./script/script_experience.js"></script>
  </body>
</html>
