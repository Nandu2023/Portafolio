<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis certificaciones</title>
    <link rel="stylesheet" href="./styles/styles_certifications.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <strong>Hernando Ramirez P.</strong>
          <span id="id_profile_subtitle"></span>
        </div>
        <button
          id="id_goToHomePage"
          class="home-link"
          type="button"
          onclick="goToHomePage()"
        ></button>
      </header>

      <section class="hero" aria-labelledby="id_certifications_h1">
        <p id="id_profile_label" class="eyebrow"></p>
        <h1 id="id_certifications_h1"></h1>
      </section>

      <section class="summary" aria-label="Resumen de certificaciones">
        <article>
          <span id="id_summary_sap_number"></span>
          <p id="id_summary_sap_label"></p>
        </article>
        <article>
          <span id="id_summary_other_number"></span>
          <p id="id_summary_other_label"></p>
        </article>
        <article>
          <span id="id_summary_latest_number"></span>
          <p id="id_summary_latest_label"></p>
        </article>
      </section>

      <section aria-labelledby="id_featured_title">
        <div class="certifications-header">
          <h2 id="id_featured_title"></h2>
          <a id="id_view_detail" href="#id_certification_detail"></a>
        </div>

        <div id="id_certifications_grid" class="certifications-grid"></div>
      </section>

      <section id="id_certification_detail" class="detail" aria-live="polite">
        <div class="detail-heading">
          <p id="id_detail_meta" class="period"></p>
          <h2 id="id_detail_title"></h2>
          <p id="id_detail_issuer"></p>
        </div>

        <div class="detail-panel">
          <h3 id="id_detail_focus_title"></h3>
          <p id="id_detail_focus"></p>
          <div id="id_detail_tags" class="tags" aria-label="Areas clave"></div>
        </div>
      </section>

      <section class="other-section" aria-labelledby="id_other_title">
        <div class="certifications-header">
          <h2 id="id_other_title"></h2>
        </div>
        <div id="id_other_grid" class="other-grid"></div>
      </section>
    </main>

    <script src="./script/script_certifications.js"></script>
  </body>
</html>
